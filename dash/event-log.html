<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevPulse — Event Log</title>
<style>
  :root {
    --bg:      oklch(10% 0.015 240);
    --surface: oklch(15% 0.02 240);
    --surface2:oklch(18% 0.022 240);
    --fg:      oklch(92% 0.005 240);
    --muted:   oklch(60% 0.018 240);
    --border:  oklch(22% 0.02 240);
    --accent:  oklch(56% 0.12 170);
    --success: oklch(62% 0.14 155);
    --warning: oklch(70% 0.14 80);
    --danger:  oklch(56% 0.18 25);
    --info:    oklch(58% 0.12 240);
    --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 100;
  }
  .topbar-logo { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); text-decoration: none; }
  .topbar-logo span { color: var(--accent); }
  .topbar-nav { display: flex; gap: 4px; }
  .topbar-nav a { color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; }
  .topbar-nav a:hover, .topbar-nav a.active { color: var(--fg); background: var(--surface2); }
  .topbar-nav a.active { color: var(--accent); }

  .main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

  .back-link { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .back-link:hover { color: var(--fg); }

  /* Filters bar */
  .filters-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .filter-pill {
    font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: 14px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .filter-pill:hover { color: var(--fg); border-color: var(--muted); }
  .filter-pill.active { background: oklch(56% 0.12 170 / 0.15); border-color: var(--accent); color: var(--accent); }
  .filter-search {
    margin-left: auto; background: var(--surface2); border: 1px solid var(--border);
    color: var(--fg); font-family: var(--font-mono); font-size: 12px;
    padding: 6px 12px; border-radius: 6px; min-width: 200px;
  }
  .filter-search::placeholder { color: var(--muted); }

  /* Stats summary */
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  .stat-mini {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .stat-mini-label { font-size: 12px; color: var(--muted); }
  .stat-mini-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Event table */
  .event-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .event-panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600;
  }
  .event-table { width: 100%; border-collapse: collapse; }
  .event-table th {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; text-align: left;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .event-table td {
    font-family: var(--font-mono); font-size: 12px; padding: 9px 14px;
    border-bottom: 1px solid oklch(22% 0.02 240 / 0.4); vertical-align: middle;
  }
  .event-table tbody tr:hover td { background: oklch(56% 0.12 170 / 0.04); }
  .ev-time { color: var(--muted); }
  .ev-type {
    font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .ev-type.deploy { color: var(--info); }
  .ev-type.error { color: var(--danger); }
  .ev-type.signup { color: var(--success); }
  .ev-type.billing { color: var(--warning); }
  .ev-type.webhook { color: oklch(62% 0.12 290); }
  .ev-type.security { color: oklch(70% 0.14 40); }
  .ev-severity {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    padding: 2px 8px; border-radius: 10px;
  }
  .ev-severity.info { background: oklch(58% 0.12 240 / 0.12); color: var(--info); }
  .ev-severity.warn { background: oklch(70% 0.14 80 / 0.12); color: var(--warning); }
  .ev-severity.error { background: oklch(56% 0.18 25 / 0.12); color: var(--danger); }
  .ev-severity.critical { background: oklch(56% 0.18 25 / 0.20); color: var(--danger); }
  .ev-env { font-size: 10px; color: var(--muted); }
  .ev-detail { color: var(--fg); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Pagination */
  .pagination {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--border);
  }
  .page-info { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .page-btns { display: flex; gap: 4px; }
  .page-btn {
    font-family: var(--font-mono); font-size: 12px; padding: 4px 10px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; cursor: pointer;
  }
  .page-btn:hover { color: var(--fg); border-color: var(--muted); }
  .page-btn.active { background: oklch(56% 0.12 170 / 0.15); border-color: var(--accent); color: var(--accent); }

  @media (max-width: 1024px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .event-table th:nth-child(3),
    .event-table td:nth-child(3) { display: none; }
  }
  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; }
    .topbar-nav { display: none; }
    .main { padding: 12px 10px; }
    .filters-bar { flex-direction: column; align-items: flex-start; }
    .filter-search { margin-left: 0; width: 100%; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .event-table th:nth-child(3),
    .event-table td:nth-child(3),
    .event-table th:nth-child(6),
    .event-table td:nth-child(6) { display: none; }
    .ev-detail { max-width: 180px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="dashboard.html" class="topbar-logo">Dev<span>Pulse</span></a>
  <nav class="topbar-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="customer-detail.html">Customers</a>
    <a href="event-log.html" class="active">Events</a>
  </nav>
  <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted)">Live</span>
</header>

<main class="main">
  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

  <!-- Stats -->
  <section class="stats-row">
    <div class="stat-mini"><span class="stat-mini-label">Events Today</span><span class="stat-mini-value">12,847</span></div>
    <div class="stat-mini"><span class="stat-mini-label">Errors (24h)</span><span class="stat-mini-value" style="color:var(--danger)">23</span></div>
    <div class="stat-mini"><span class="stat-mini-label">Avg. Latency</span><span class="stat-mini-value">18ms</span></div>
    <div class="stat-mini"><span class="stat-mini-label">Uptime</span><span class="stat-mini-value" style="color:var(--success)">99.98%</span></div>
  </section>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="filter-group">
      <span class="filter-label">Type:</span>
      <span class="filter-pill active" data-filter="all">All</span>
      <span class="filter-pill" data-filter="deploy">Deploy</span>
      <span class="filter-pill" data-filter="error">Error</span>
      <span class="filter-pill" data-filter="signup">Signup</span>
      <span class="filter-pill" data-filter="billing">Billing</span>
      <span class="filter-pill" data-filter="security">Security</span>
    </div>
    <div class="filter-group">
      <span class="filter-label">Severity:</span>
      <span class="filter-pill active" data-filter="all-sev">All</span>
      <span class="filter-pill" data-filter="info">Info</span>
      <span class="filter-pill" data-filter="warn">Warn</span>
      <span class="filter-pill" data-filter="error">Error</span>
    </div>
    <input class="filter-search" type="text" placeholder="Search events...">
  </div>

  <!-- Event Table -->
  <section class="event-panel">
    <div class="event-panel-header">
      <span>Event Log</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">Showing 50 of 12,847</span>
    </div>
    <div style="overflow-x:auto">
      <table class="event-table">
        <thead>
          <tr><th>Time</th><th>Type</th><th>Severity</th><th>Environment</th><th>Detail</th><th>Source</th></tr>
        </thead>
        <tbody id="event-tbody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <span class="page-info">Page 1 of 10</span>
      <div class="page-btns">
        <span class="page-btn active">1</span>
        <span class="page-btn">2</span>
        <span class="page-btn">3</span>
        <span class="page-btn">…</span>
        <span class="page-btn">10</span>
      </div>
    </div>
  </section>
</main>

<script>
  // ── Event Data Generator ──
  const EVENT_POOL = [
    { type:'deploy', sev:'info', envs:['prod','staging','canary'], sources:['ci/cd','github-actions'],
      templates:[
        'v{V} — canary rollout to {E} complete',
        'v{V} — blue/green swap finished',
        'Rollback v{V} in {E} — config drift detected',
        'v{V} deployed to {E} — {N} pods healthy',
      ]},
    { type:'error', sev:'error', envs:['prod','staging'], sources:['api-gateway','worker-3','db-primary'],
      templates:[
        '{S} latency spike — p99 {N}ms',
        '{S} 5xx spike — {N} errors in 60s',
        'Connection pool exhausted on {S}',
        'OOM kill on {S} — restarting',
      ]},
    { type:'signup', sev:'info', envs:['us-east','eu-west','ap-se'], sources:['auth-service'],
      templates:[
        'New team "{T}" — {N} seats, {E}',
        'Trial started for "{T}" — {N} days',
        'Team "{T}" verified domain — {E}',
      ]},
    { type:'billing', sev:'info', envs:['us-east','eu-west'], sources:['stripe','billing-svc'],
      templates:[
        '{T} upgraded {P1} → {P2} — {E}',
        'Invoice #{ID} for {T} — ${N}',
        'Payment failed for {T} — retry {N}/3',
        'Credit added to {T} — ${N}',
      ]},
    { type:'webhook', sev:'info', envs:['prod','staging'], sources:['webhook-relay'],
      templates:[
        'Outbound webhook to {T} — 200 OK',
        'Outbound webhook to {T} — retry {N}',
        'Webhook secret rotated for {T}',
      ]},
    { type:'security', sev:'warn', envs:['prod'], sources:['auth-service','waf'],
      templates:[
        'Failed login attempt for admin@{T}.com',
        'MFA reset requested by user {N}',
        'API key rotated for service account {T}',
        'Suspicious IP blocked — {IP}',
      ]},
  ];

  const TEAMS = ['Acme Corp','Globex Inc','Initech','Umbrella Co','Stark Industries','Wayne Ent.','Cyberdyne','Nexus Labs','PixelForge','DataDyne'];
  const PLANS = ['Free','Pro','Enterprise'];
  const IP_PARTS = ()=> `${~~(Math.random()*223)+1}.${~~(Math.random()*255)}.${~~(Math.random()*255)}.${~~(Math.random()*255)}`;

  function rand(arr) { return arr[~~(Math.random()*arr.length)]; }
  function rint(min,max) { return ~~(Math.random()*(max-min+1))+min; }

  function genEvent() {
    const pool = rand(EVENT_POOL);
    let detail = rand(pool.templates);
    const team = rand(TEAMS);
    detail = detail.replace('{T}', team);
    detail = detail.replace('{E}', rand(pool.envs));
    detail = detail.replace('{S}', rand(pool.sources));
    detail = detail.replace('{P1}', rand(PLANS));
    detail = detail.replace('{P2}', rand(PLANS));
    detail = detail.replace('{V}', `${rint(2,3)}.${rint(0,9)}.${rint(0,9)}`);
    detail = detail.replace(/\{N\}/g, () => String(rint(1, 999)));
    detail = detail.replace(/\{ID\}/g, () => `INV-${String(rint(100,9999))}`);
    detail = detail.replace('{IP}', IP_PARTS());

    const h = rint(0, 23).toString().padStart(2,'0');
    const m = rint(0, 59).toString().padStart(2,'0');
    const s = rint(0, 59).toString().padStart(2,'0');

    let sevClass;
    if (pool.type === 'error') sevClass = Math.random() < 0.1 ? 'critical' : 'error';
    else if (pool.type === 'security') sevClass = Math.random() < 0.3 ? 'error' : 'warn';
    else sevClass = pool.sev;

    return { time:`${h}:${m}:${s}`, type:pool.type, severity:sevClass, env:rand(pool.envs), detail, source:rand(pool.sources) };
  }

  // Generate 50 events
  const events = Array.from({length:50}, genEvent).sort((a,b) => b.time.localeCompare(a.time));

  const tbody = document.getElementById('event-tbody');
  tbody.innerHTML = events.map(e => `
    <tr data-type="${e.type}" data-sev="${e.severity}">
      <td class="ev-time">${e.time}</td>
      <td><span class="ev-type ${e.type}">${e.type}</span></td>
      <td><span class="ev-severity ${e.severity}">${e.severity}</span></td>
      <td class="ev-env">${e.env}</td>
      <td class="ev-detail" title="${e.detail}">${e.detail}</td>
      <td class="ev-env">${e.source}</td>
    </tr>
  `).join('');

  // ── Filter Interactions ──
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', function() {
      const group = this.parentElement;
      group.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      this.classList.add('active');

      const typeFilter = document.querySelector('[data-filter="all"].active') ? null
        : document.querySelector('.filter-group:nth-child(1) .filter-pill.active')?.dataset.filter;
      const sevFilter = document.querySelector('[data-filter="all-sev"].active') ? null
        : document.querySelector('.filter-group:nth-child(2) .filter-pill.active')?.dataset.filter;

      document.querySelectorAll('#event-tbody tr').forEach(row => {
        const type = row.dataset.type;
        const sev = row.dataset.sev;
        row.style.display = (!typeFilter || type === typeFilter) && (!sevFilter || sev === sevFilter) ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
