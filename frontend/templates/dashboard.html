{% extends "base.html" %}
{% block title %}仪表盘 - Warehouse-s{% endblock %}

{% block content %}
<style>
/* ===== 仪表盘专用样式（8dp 间距体系） ===== */

.dashboard { display: flex; flex-direction: column; gap: 16px; flex: 1; }
/* 仪表盘自行拉伸面板，须覆盖全局 ::after */
.main-content::after { flex: 0 0 0; content: none; }

/* --- 统计卡片 --- */
.quick-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.quick-stat {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: var(--radius);
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s ease;
  min-height: 56px; /* 满足 44px + padding 的触控标准 */
}
.quick-stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); background: var(--bg-card-hover); }
.quick-stat:active { transform: scale(.98); transition: transform 0.1s; }
.quick-stat-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.quick-stat-icon.danger  { background: rgba(207,45,86,0.10); color: var(--danger); }
.quick-stat-icon.success { background: rgba(31,138,101,0.10); color: var(--success); }
.quick-stat-icon.warning { background: rgba(245,78,0,0.10); color: var(--primary); }
.quick-stat-icon.info    { background: rgba(159,187,224,0.15); color: #5A7BA8; }
.quick-stat-info { display: flex; flex-direction: column; min-width: 0; }
.quick-stat-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--primary); line-height: 1.15; }
.quick-stat-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

/* --- 面板通用 --- */
.dash-row-2, .dash-row-3 { display: flex; gap: 16px; flex: 1; min-height: 0; }
.dash-row-2 .dash-panel:first-child { flex: 1.15; min-width: 0; }
.dash-row-2 .dash-panel:last-child  { flex: 0.85; min-width: 0; }
.dash-row-3 .dash-panel { flex: 1; min-width: 0; }
.dash-panel {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: box-shadow 0.2s ease;
  display: flex; flex-direction: column;
}
.dash-panel:hover { box-shadow: var(--shadow-hover); }
.dash-panel-title {
  font-size: 13px; font-weight: 600; color: var(--text-secondary);
  padding: 10px 16px; background: var(--bg-soft);
  display: flex; align-items: center; gap: 7px;
  border-bottom: 1px solid var(--border);
}
.dash-panel-title i { color: var(--primary); font-size: 14px; }
.dash-panel-body { padding: 12px 16px; flex: 1; min-height: 0; }

/* --- 待处理事项 --- */
.pending-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid var(--border-light);
  font-size: 13px; color: var(--text); text-decoration: none;
  transition: all 0.15s ease;
  min-height: 38px;
}
.pending-item:last-child { border-bottom: none; }
.pending-item:hover { color: var(--primary); background: rgba(245,78,0,0.03); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }

/* --- 低库存预警 --- */
.lowstock-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border-light);
  font-size: 13px; color: var(--text); text-decoration: none;
  transition: all 0.15s ease;
  min-height: 38px;
}
.lowstock-item:last-child { border-bottom: none; }
.lowstock-item:hover { color: var(--primary); background: rgba(245,78,0,0.03); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }

/* --- 仓库库存 --- */
.warehouse-bar-row { margin-bottom: 8px; }
.warehouse-bar-row:last-child { margin-bottom: 0; }
.warehouse-bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.warehouse-bar-label span:last-child { font-weight: 600; color: var(--text); }
.warehouse-bar-track { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
.warehouse-bar-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.6s cubic-bezier(.25,.1,.25,1); }

/* --- 分类分布 --- */
.category-dot-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 13px; }
.category-dot-row:last-child { margin-bottom: 0; }
.category-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.category-dot-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 500; }
.category-dot-count { color: var(--text-muted); min-width: 28px; text-align: right; }
.category-dot-pct { min-width: 36px; text-align: right; color: var(--text-secondary); }

/* --- 本周概览 --- */
.week-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
.week-stat { text-align: center; padding: 6px 4px; }
.week-num { font-size: 22px; font-weight: 700; color: var(--primary); display: block; line-height: 1.2; }
.week-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: block; }
.week-stat-full { grid-column: 1 / -1; display: flex; justify-content: center; gap: 24px; padding: 4px 0; border-top: 1px solid var(--border-light); }
.week-stat-inline { text-align: center; }
.week-stat-inline .week-num { font-size: 16px; display: inline; }
.week-stat-inline .week-lbl { font-size: 12px; display: inline; margin-left: 4px; }

/* --- 响应式 --- */
@media (max-width: 1023px) {
  .quick-stats { grid-template-columns: repeat(3, 1fr); }
  .dash-row-2, .dash-row-3 { flex-direction: column; }
}
@media (max-width: 767px) {
  .quick-stats { grid-template-columns: repeat(2, 1fr); }
  .week-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<div class="dashboard" x-data="dashboardData()" x-init="init()">
  <!-- ═══ 行1: 统计卡片 ═══ -->
  <div class="quick-stats">
    <div class="quick-stat" @click="go('/records?status=逾期')">
      <div class="quick-stat-icon danger"><i class="bi bi-exclamation-triangle"></i></div>
      <div class="quick-stat-info">
        <span class="quick-stat-value" x-text="fmt(stats.total_overdue)">--</span>
        <span class="quick-stat-label">逾期</span>
      </div>
    </div>
    {% if current_user.role in ('admin', 'approver') %}
    <div class="quick-stat" @click="go('/approvals')">
    {% else %}
    <div class="quick-stat" @click="go('/records?status=待审核')">
    {% endif %}
      <div class="quick-stat-icon warning"><i class="bi bi-hourglass-split"></i></div>
      <div class="quick-stat-info">
        <span class="quick-stat-value" x-text="fmt(stats.total_pending_approval)">--</span>
        <span class="quick-stat-label">待审核</span>
      </div>
    </div>
    <div class="quick-stat" @click="go('/records?status=借出中')">
      <div class="quick-stat-icon info"><i class="bi bi-box-arrow-right"></i></div>
      <div class="quick-stat-info">
        <span class="quick-stat-value" x-text="fmt(stats.total_borrowed)">--</span>
        <span class="quick-stat-label">在借中</span>
      </div>
    </div>
    <div class="quick-stat">
      <div class="quick-stat-icon success"><i class="bi bi-arrow-return-left"></i></div>
      <div class="quick-stat-info">
        <span class="quick-stat-value" x-text="fmt(stats.total_returned_today)">--</span>
        <span class="quick-stat-label">今日归还</span>
      </div>
    </div>
    <div class="quick-stat" @click="go('/items?low_stock=1')">
      <div class="quick-stat-icon warning"><i class="bi bi-exclamation-diamond"></i></div>
      <div class="quick-stat-info">
        <span class="quick-stat-value" x-text="fmt(stats.low_stock_count)">--</span>
        <span class="quick-stat-label">低库存</span>
      </div>
    </div>
  </div>

  <!-- ═══ 行2: 待处理事项 + 低库存预警 ═══ -->
  <div class="dash-row-2">
    <!-- 左：待处理事项 -->
    <div class="dash-panel">
      <div class="dash-panel-title"><i class="bi bi-list-check"></i>待处理事项<span style="margin-left:auto;font-weight:400;font-size:12px;color:var(--text-muted);" id="pending-total"></span></div>
      <div class="dash-panel-body" id="pending-panel">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>
    <!-- 右：低库存预警 -->
    <div class="dash-panel">
      <div class="dash-panel-title"><i class="bi bi-exclamation-triangle"></i>低库存预警</div>
      <div class="dash-panel-body" id="lowstock-panel">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>
  </div>

  <!-- ═══ 行3: 仓库库存 + 分类分布 + 本周概览 ═══ -->
  <div class="dash-row-3">
    <div class="dash-panel">
      <div class="dash-panel-title"><i class="bi bi-building"></i>仓库库存</div>
      <div class="dash-panel-body" id="warehouse-panel"></div>
    </div>
    <div class="dash-panel">
      <div class="dash-panel-title"><i class="bi bi-grid"></i>物品分类</div>
      <div class="dash-panel-body" id="category-panel"></div>
    </div>
    <div class="dash-panel">
      <div class="dash-panel-title"><i class="bi bi-calendar-week"></i>本周概览</div>
      <div class="dash-panel-body" id="week-panel"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function dashboardData() {
  return {
    stats: {},
    fmt(v) { return v == null ? '--' : v; },
    go(url) { location.href = url; },

    /* 待处理事项面板 */
    buildPending(stats) {
      const isStaff = {{ 'true' if current_user.role in ('admin', 'approver') else 'false' }};
      if (!isStaff) {
        return `<p style="color:var(--text-muted);padding:20px 0;text-align:center;">你暂无审核权限</p>`;
      }
      const items = [
        { label: '物品租借待审', count: stats.pending_records || 0, url: '/approvals?type=records', icon: 'bi-box-seam' },
        { label: '耗材领用待审', count: stats.pending_consumables || 0, url: '/approvals?type=consumable', icon: 'bi-droplet' },
        { label: '固产领用待审', count: stats.pending_assets || 0, url: '/approvals?type=asset', icon: 'bi-pc-display' },
        { label: '调拨待审', count: stats.pending_transfers || 0, url: '/approvals?type=transfers', icon: 'bi-arrow-left-right' },
      ];
      const total = items.reduce((s, i) => s + i.count, 0);
      if (total === 0) {
        return `<p style="color:var(--text-muted);padding:20px 0;text-align:center;"><i class="bi bi-check-circle" style="color:var(--success);"></i> 暂无待处理事项</p>`;
      }
      return items.map(i => `
        <a href="${i.url}" class="pending-item">
          <span style="display:flex;align-items:center;gap:6px;"><i class="bi ${i.icon}"></i>${i.label}</span>
          ${i.count > 0 ? `<span class="status-badge pending">${i.count} 笔</span>` : `<span style="color:var(--text-muted);font-size:12px;">0</span>`}
        </a>
      `).join('');
    },

    /* 低库存预警面板 */
    buildLowStock(items) {
      if (!items || items.length === 0) {
        return `<p style="color:var(--text-muted);padding:20px 0;text-align:center;"><i class="bi bi-check-circle" style="color:var(--success);"></i> 库存充足</p>`;
      }
      const maxShow = 5;
      const list = items.slice(0, maxShow);
      return list.map(i => `
        <a href="/items?low_stock=1" class="lowstock-item">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(i.name || '?')}</span>
          <span style="font-size:12px;color:var(--text-muted);">${i.item_type === 'consumable' ? '耗材' : '工具'}</span>
          <span class="status-badge ${(i.available||0) === 0 ? 'rejected' : 'pending'}" style="font-size:12px;padding:2px 8px;">剩 ${i.available || 0} / 阈 ${i.threshold || 0}</span>
        </a>
      `).join('') + (items.length > maxShow ? `<p style="text-align:center;margin-top:4px;font-size:12px;"><a href="/items?low_stock=1">查看全部 ${items.length} 项 →</a></p>` : '');
    },

    /* 仓库库存分布（横向条形图） */
    buildWarehouse(dist) {
      if (!dist || dist.length === 0) return '<p style="color:var(--text-muted);padding:16px 0;text-align:center;font-size:13px;">暂无数据</p>';
      const max = Math.max(...dist.map(d => d.count), 1);
      return dist.map(d => {
        const pct = Math.round(d.count / max * 100);
        return `<div class="warehouse-bar-row">
          <div class="warehouse-bar-label"><span>${esc(d.name)}</span><span>${d.count}</span></div>
          <div class="warehouse-bar-track"><div class="warehouse-bar-fill" style="width:${pct}%;"></div></div>
        </div>`;
      }).join('');
    },

    /* 分类分布（圆点列表） */
    buildCategory(dist) {
      if (!dist || dist.length === 0) return '<p style="color:var(--text-muted);padding:16px 0;text-align:center;font-size:13px;">暂无数据</p>';
      const total = dist.reduce((s, d) => s + d.count, 0) || 1;
      const colors = ['var(--primary)','#C08532','#E04A00','#D49E40','#D94300','#A07020'];
      return dist.slice(0, 6).map((d, i) => {
        const pct = Math.round(d.count / total * 100);
        return `<div class="category-dot-row">
          <span class="category-dot" style="background:${colors[i%6]};"></span>
          <span class="category-dot-name">${esc(d.name)}</span>
          <span class="category-dot-count">${d.count}</span>
          <span class="category-dot-pct">${pct}%</span>
        </div>`;
      }).join('');
    },

    /* 本周概览（3+2 网格） */
    buildWeekSummary(stats) {
      return `
        <div class="week-grid">
          <div class="week-stat"><span class="week-num">${stats.total_items || 0}</span><span class="week-lbl">物品总数</span></div>
          <div class="week-stat"><span class="week-num">${stats.total_quantity || 0}</span><span class="week-lbl">库存总量</span></div>
          <div class="week-stat"><span class="week-num">${stats.total_available || 0}</span><span class="week-lbl">可用物品</span></div>
          <div class="week-stat"><span class="week-num">${stats.category_count || 0}</span><span class="week-lbl">物品分类</span></div>
          <div class="week-stat"><span class="week-num" style="color:var(--danger);">${stats.approval_timeout_count || 0}</span><span class="week-lbl">审批超时</span></div>
          <div class="week-stat"><span class="week-num">${stats.total_borrowed || 0}</span><span class="week-lbl">当前在借</span></div>
        </div>`;
    },

    async init() {
      try {
        const resp = await api('/api/v1/stats/');
        if (!resp.ok) return;
        const data = await resp.json();
        this.stats = data;

        document.getElementById('pending-panel').innerHTML = this.buildPending(data);
        document.getElementById('lowstock-panel').innerHTML = this.buildLowStock(data.low_stock_items || []);
        document.getElementById('warehouse-panel').innerHTML = this.buildWarehouse(data.warehouse_distribution || []);
        document.getElementById('category-panel').innerHTML = this.buildCategory(data.category_distribution || []);
        document.getElementById('week-panel').innerHTML = this.buildWeekSummary(data);

        // 面板标题后缀（待处理总数）
        const pTotal = (data.pending_records||0)+(data.pending_consumables||0)+(data.pending_assets||0)+(data.pending_transfers||0);
        const ptEl = document.getElementById('pending-total');
        if (ptEl && pTotal > 0) ptEl.textContent = `共 ${pTotal} 笔`;
      } catch (e) { console.error('加载仪表盘失败:', e); }
    }
  };
}
</script>
{% endblock %}
