{% extends "base.html" %}
{% block title %}租借记录 - Warehouse-s{% endblock %}

{% block content %}
<div class="flex-between mb-16">
  <h2>租借记录</h2>
</div>

<!-- 筛选栏 -->
<div class="filter-bar">
  <input type="text" id="search-input" class="form-input" placeholder="搜索借用人/事由..." oninput="loadRecords()">
  <select id="status-filter" class="form-select" onchange="loadRecords()">
    <option value="">全部状态</option>
    <option value="待审核">待审核</option>
    <option value="借出中">借出中</option>
    <option value="已拒绝">已拒绝</option>
    <option value="已归还">已归还</option>
    <option value="逾期">逾期</option>
  </select>
</div>

<div id="records-table-container">
  <div class="text-center text-muted" style="padding:48px;">加载中...</div>
</div>

<!-- 全部归还确认弹窗 -->
<div class="modal-overlay" id="confirm-return-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="confirm-return-title">确认全部归还</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('confirm-return-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirm-return-message" class="text-muted"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirm-return-modal')">取消</button>
      <button class="btn btn-success" id="confirm-return-btn">确认归还</button>
    </div>
  </div>
</div>

<!-- 归还模态框 -->
<div class="modal-overlay" id="return-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>归还物品</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('return-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <form onsubmit="submitReturn(event)">
        <input type="hidden" id="return-record-id">
        <p id="return-item-info" class="mb-16"></p>
        <div class="form-group">
          <label class="form-label">归还数量 *</label>
          <input type="number" id="return-quantity" class="form-input" min="1" required>
          <small id="return-max-hint" class="text-muted"></small>
        </div>
        <div class="form-group">
          <label class="form-label">实际归还日期</label>
          <input type="date" id="return-date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea id="return-notes" class="form-textarea" placeholder="归还备注（可选）"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">确认归还</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let recordsPage = 1;

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function openReturnModal(record) {
  document.getElementById('return-record-id').value = record.id;
  document.getElementById('return-item-info').textContent =
    `物品: ${record.item_name} | 借出数量: ${record.quantity} | 借用人: ${record.borrower_name}`;
  document.getElementById('return-quantity').max = record.quantity;
  document.getElementById('return-quantity').value = record.quantity;
  document.getElementById('return-max-hint').textContent = `最大可归还: ${record.quantity}`;
  document.getElementById('return-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('return-notes').value = '';
  openModal('return-modal');
}

async function submitReturn(e) {
  e.preventDefault();
  const recordId = document.getElementById('return-record-id').value;
  const body = {
    return_quantity: parseInt(document.getElementById('return-quantity').value),
    actual_return_date: document.getElementById('return-date').value,
    return_notes: document.getElementById('return-notes').value,
  };
  const resp = await api(`/api/v1/records/${recordId}/return`, { method: 'PUT', body: JSON.stringify(body) });
  if (resp.ok) {
    const data = await resp.json();
    showToast(data.message || '归还成功');
    closeModal('return-modal');
    loadRecords(recordsPage);
  } else {
    const data = await resp.json();
    showToast(data.detail || '归还失败', 'error');
  }
}

function toggleDocGroup(header) {
  const body = header.nextElementSibling;
  const toggle = header.querySelector('.doc-group-toggle');
  if (body.style.display === 'none') {
    body.style.display = '';
    header.classList.remove('expanded');
    toggle.textContent = '▼';
  } else {
    body.style.display = 'none';
    header.classList.add('expanded');
    toggle.textContent = '▶';
  }
}

let _returnCallback = null;

function showConfirmReturnDialog(title, message, onConfirm) {
  document.getElementById('confirm-return-title').textContent = title;
  document.getElementById('confirm-return-message').textContent = message;
  _returnCallback = onConfirm;
  openModal('confirm-return-modal');
}

document.getElementById('confirm-return-btn').addEventListener('click', () => {
  if (_returnCallback) { closeModal('confirm-return-modal'); _returnCallback(); _returnCallback = null; }
});

async function returnByDocument(docNo) {
  showConfirmReturnDialog(
    '确认全部归还',
    `确定归还单据 ${docNo} 下的所有物品吗？`,
    async () => {
      const resp = await api(`/api/v1/records/by-document/${encodeURIComponent(docNo)}/return`, {
        method: 'PUT',
        body: JSON.stringify({
          actual_return_date: new Date().toISOString().split('T')[0],
          return_notes: '',
        })
      });
      if (resp.ok) {
        const d = await resp.json();
        showToast(d.message || '归还成功');
        loadRecords(recordsPage);
      } else {
        const d = await resp.json();
        showToast(d.detail || '归还失败', 'error');
      }
    }
  );
}

async function loadRecords(page = 1) {
  recordsPage = page;
  const keyword = document.getElementById('search-input').value;
  const status = document.getElementById('status-filter').value;
  const params = new URLSearchParams({ page, page_size: 50, keyword, status });

  const resp = await api(`/api/v1/records/?${params}`);
  const container = document.getElementById('records-table-container');
  if (!resp.ok) { container.innerHTML = '<div class="empty-state">加载失败</div>'; return; }

  const data = await resp.json();
  if (data.items.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无租借记录</p></div>';
    return;
  }

  // 按单据号分组
  const groups = {};
  data.items.forEach(r => {
    const key = r.document_no || `SINGLE_${r.id}`;
    if (!groups[key]) groups[key] = { document_no: r.document_no, items: [] };
    groups[key].items.push(r);
  });

  const isStaff = AppState.isAdmin || AppState.isApprover;
  let html = '';

  for (const [key, group] of Object.entries(groups)) {
    const items = group.items;
    const docNo = group.document_no;
    const label = docNo ? `单据号: ${docNo}` : '单条记录';
    const firstItem = items[0];
    const itemCount = items.length;
    const allReturnable = items.every(r => r.status === '借出中' || r.status === '逾期');
    const anyReturnable = items.some(r => r.status === '借出中' || r.status === '逾期');

    html += `<div class="doc-group">
      <div class="doc-group-header" onclick="toggleDocGroup(this)">
        <div class="doc-group-meta">
          <strong>${label}</strong>
          <span>借用人: ${escapeHtml(firstItem.borrower_name)}</span>
          <span>${itemCount} 件物品</span>
          <span>借出: ${firstItem.borrow_date} ~ ${firstItem.expected_return_date}</span>
          <span class="text-muted" style="font-size:12px;">提交: ${(firstItem.created_at || '').split(' ')[0]}</span>

        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${isStaff && anyReturnable && docNo ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation();returnByDocument('${docNo}')">全部归还</button>` : ''}
          <span class="doc-group-toggle">▼</span>
        </div>
      </div>
      <div class="doc-group-body">
        <table class="table">
          <thead><tr>
            <th>ID</th><th>物品</th><th>来源仓库</th><th>数量</th><th>借出日期</th><th>预计归还</th><th>状态</th>
            ${isStaff ? '<th>操作</th>' : ''}
          </tr></thead>
          <tbody>${items.map(r => `
            <tr>
              <td>${r.id}</td><td>${r.item_name}</td>
              <td class="text-muted" style="font-size:12px;">${escapeHtml(r.source_warehouse_name || '-')}</td>
              <td>${r.quantity}</td><td>${r.borrow_date}</td><td>${r.expected_return_date}</td>
              <td><span class="status-badge ${r.status === '借出中' ? 'lent' : r.status === '已归还' ? 'returned' : r.status === '逾期' ? 'overdue' : r.status === '待审核' ? 'pending' : 'rejected'}">${r.status}</span></td>
              ${isStaff ? `<td>
                ${r.status === '借出中' || r.status === '逾期' ? `<button class="btn btn-success btn-sm" onclick='openReturnModal(${JSON.stringify(r).replace(/'/g, "&#39;")})'>归还</button>` : ''}
              </td>` : ''}
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  container.innerHTML = html;

  // 分页
  const pages = Math.ceil(data.total / 50);
  if (pages > 1) {
    let pagHtml = '<div class="pagination">';
    pagHtml += `<button onclick="loadRecords(${page-1})" ${page===1?'disabled':''}>上一页</button>`;
    for (let i = 1; i <= pages; i++) {
      pagHtml += `<button class="${i===page?'active':''}" onclick="loadRecords(${i})">${i}</button>`;
    }
    pagHtml += `<button onclick="loadRecords(${page+1})" ${page===pages?'disabled':''}>下一页</button></div>`;
    container.innerHTML += pagHtml;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  if (status) {
    document.getElementById('status-filter').value = status;
  }
  loadRecords();
});
</script>
{% endblock %}
