{% extends "base.html" %}
{% block title %}审核管理 - Warehouse-s{% endblock %}

{% block content %}
<h2 class="mb-16">审核管理</h2>

<div class="stats-grid" style="margin-bottom:20px;">
  <div class="stat-card"><div class="stat-value" id="stat-pending">--</div><div class="stat-label">租借待审</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-transfer">--</div><div class="stat-label">调拨待审</div></div>
  <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/records'" title="点击查看所有租借记录"><div class="stat-value" id="stat-to-return">--</div><div class="stat-label">待归还 (借出中+逾期)</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-overtime">--</div><div class="stat-label">已超时</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-today">--</div><div class="stat-label">今日处理</div></div>
</div>

<div class="filter-bar" style="margin-bottom:16px;">
  <select id="approval-type" class="form-select" onchange="loadApprovals(1)">
    <option value="all">全部待审核</option>
    <option value="records">物品租借</option>
    <option value="transfers">仓库调拨</option>
  </select>
</div>

<div id="approvals-table-container">
  <div class="text-center text-muted" style="padding:48px;">加载中...</div>
</div>

<!-- 审核确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="confirm-title">确认操作</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('confirm-modal')">&times;</button>
    </div>
    <div class="modal-body"><p id="confirm-message" class="text-muted"></p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-success" id="confirm-btn">确认通过</button>
    </div>
  </div>
</div>

<!-- 审核驳回弹窗 -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="reject-title">驳回申请</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('reject-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <p id="reject-message" class="text-muted"></p>
      <div class="form-group" style="margin-top:12px;">
        <label class="form-label">驳回原因 *</label>
        <textarea id="reject-reason" class="form-textarea" placeholder="请填写驳回原因（必填）" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reject-modal')">取消</button>
      <button class="btn btn-danger" id="reject-btn">确认驳回</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let approvalPage = 1;

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── 确认/驳回弹窗 ──
let _confirmCb = null, _rejectCb = null;

function showConfirmDialog(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = msg;
  _confirmCb = cb; openModal('confirm-modal');
}
document.getElementById('confirm-btn').addEventListener('click', () => {
  if (_confirmCb) { closeModal('confirm-modal'); _confirmCb(); _confirmCb = null; }
});

function showRejectDialog(title, msg, cb) {
  document.getElementById('reject-title').textContent = title;
  document.getElementById('reject-message').textContent = msg;
  document.getElementById('reject-reason').value = '';
  _rejectCb = cb; openModal('reject-modal');
}
document.getElementById('reject-btn').addEventListener('click', () => {
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { showToast('请填写驳回原因', 'error'); return; }
  if (_rejectCb) { closeModal('reject-modal'); _rejectCb(reason); _rejectCb = null; }
});

// ── 折叠 ──
function toggleDocGroup(h) {
  const b = h.nextElementSibling, t = h.querySelector('.doc-group-toggle');
  if (b.style.display === 'none') { b.style.display = ''; t.textContent = '▼'; }
  else { b.style.display = 'none'; t.textContent = '▶'; }
}

// ── 统计 ──
async function loadStats() {
  const r = await api('/api/v1/approvals/stats');
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById('stat-pending').textContent = d.total_pending;
  document.getElementById('stat-transfer').textContent = d.transfer_pending || 0;
  document.getElementById('stat-to-return').textContent = d.to_return || 0;
  document.getElementById('stat-overtime').textContent = d.total_overtime;
  document.getElementById('stat-today').textContent = d.today_processed;
}

// ── 租借审核操作 ──
function doApproveWithConfirm(id) { showConfirmDialog('确认通过', '确定通过该物品的租借申请吗？', () => doApprove(id)); }
function showRejectDialogForId(id) { showRejectDialog('驳回申请', '确定驳回该物品的租借申请吗？', (r) => doReject(id, r)); }

async function doApprove(id) {
  const r = await api('/api/v1/approvals/' + id + '/approve', { method: 'PUT', body: JSON.stringify({ comment: '' }) });
  if (r.ok) { showToast('已通过'); loadApprovals(approvalPage); loadStats(); }
  else { const d = await r.json(); showToast(d.detail, 'error'); }
}
async function doReject(id, reason) {
  const r = await api('/api/v1/approvals/' + id + '/reject', { method: 'PUT', body: JSON.stringify({ comment: reason }) });
  if (r.ok) { showToast('已驳回'); loadApprovals(approvalPage); loadStats(); }
  else { const d = await r.json(); showToast(d.detail, 'error'); }
}
async function approveByDocument(docNo) {
  showConfirmDialog('全部通过', '确定通过单据 ' + docNo + ' 的所有申请吗？', async () => {
    const r = await api('/api/v1/approvals/by-document/' + encodeURIComponent(docNo) + '/approve', { method: 'PUT', body: JSON.stringify({ comment: '' }) });
    if (r.ok) { const d = await r.json(); showToast(d.message || '已全部通过'); loadApprovals(approvalPage); loadStats(); }
    else { const d = await r.json(); showToast(d.detail, 'error'); }
  });
}
async function rejectByDocument(docNo) {
  showRejectDialog('全部驳回', '确定驳回单据 ' + docNo + ' 的所有申请吗？', async (reason) => {
    const r = await api('/api/v1/approvals/by-document/' + encodeURIComponent(docNo) + '/reject', { method: 'PUT', body: JSON.stringify({ comment: reason }) });
    if (r.ok) { const d = await r.json(); showToast(d.message || '已全部驳回'); loadApprovals(approvalPage); loadStats(); }
    else { const d = await r.json(); showToast(d.detail, 'error'); }
  });
}

// ── 调拨审核操作 ──
async function doApproveTransfer(id) {
  const r = await api('/api/v1/transfers/' + id + '/approve', { method: 'PUT' });
  if (r.ok) { showToast('已通过'); loadApprovals(approvalPage); loadStats(); }
  else { const d = await r.json(); showToast(d.detail, 'error'); }
}
function showRejectTransferForId(id) {
  showRejectDialog('驳回调拨', '确定驳回该调拨申请吗？', async (reason) => {
    const r = await api('/api/v1/transfers/' + id + '/reject', { method: 'PUT', body: JSON.stringify({ reason }) });
    if (r.ok) { showToast('已驳回'); loadApprovals(approvalPage); loadStats(); }
    else { const d = await r.json(); showToast(d.detail, 'error'); }
  });
}
async function approveTransferDocument(docNo) {
  showConfirmDialog('全部通过', '确定通过调拨单 ' + docNo + ' 的所有物品吗？', async () => {
    const r = await api('/api/v1/transfers/by-document/' + encodeURIComponent(docNo) + '/approve', { method: 'PUT' });
    if (r.ok) { const d = await r.json(); showToast(d.message || '已全部通过'); loadApprovals(approvalPage); loadStats(); }
    else { const d = await r.json(); showToast(d.detail, 'error'); }
  });
}
function showRejectTransferDialog(docNo) {
  showRejectDialog('全部驳回', '确定驳回调拨单 ' + docNo + ' 的所有物品吗？', async (reason) => {
    const r = await api('/api/v1/transfers/by-document/' + encodeURIComponent(docNo) + '/reject', { method: 'PUT', body: JSON.stringify({ reason }) });
    if (r.ok) { showToast('已全部驳回'); loadApprovals(approvalPage); loadStats(); }
    else { const d = await r.json(); showToast(d.detail, 'error'); }
  });
}

// ── 主加载 ──
async function loadApprovals(page) {
  approvalPage = page || 1;
  const type = document.getElementById('approval-type').value;
  const container = document.getElementById('approvals-table-container');
  let recData = null, trData = null;

  if (type !== 'transfers') {
    const r = await api('/api/v1/approvals/pending-grouped?page=' + approvalPage + '&page_size=15');
    if (r.ok) recData = await r.json();
  }
  if (type !== 'records') {
    const r = await api('/api/v1/approvals/pending-transfers?page=' + approvalPage + '&page_size=15');
    if (r.ok) trData = await r.json();
  }

  const recDocs = recData ? (recData.documents || []) : [];
  const trDocs = trData ? (trData.groups || []) : [];

  if (recDocs.length === 0 && trDocs.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon"><i class="bi bi-clipboard-check"></i></div><p>暂无待审核记录</p></div>';
    return;
  }

  let html = '';
  for (const doc of recDocs) {
    const hasDoc = doc.document_no !== null;
    const os = doc.is_overtime ? ' style="border-left:3px solid var(--danger);"' : '';
    html += '<div class="doc-group"' + os + '>';
    html += '<div class="doc-group-header" onclick="toggleDocGroup(this)">';
    html += '<div class="doc-group-meta">';
    html += '<strong>' + (hasDoc ? '单据号: ' + doc.document_no : '单条记录') + '</strong>';
    html += '<span class="status-badge approved" style="font-size:11px;">物品租借</span>';
    html += '<span>借用人: ' + escapeHtml(doc.borrower_name || '') + '</span>';
    html += '<span>' + doc.item_count + ' 件物品</span>';
    html += '<span>' + (doc.borrow_date || '') + ' ~ ' + (doc.expected_return_date || '') + '</span>';
    if (doc.is_overtime) html += '<span class="status-badge overdue">超时</span>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    if (hasDoc) {
      html += '<button class="btn btn-success btn-sm" onclick="event.stopPropagation();approveByDocument(\'' + doc.document_no + '\')">全部通过</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();rejectByDocument(\'' + doc.document_no + '\')">全部驳回</button>';
    }
    html += '<span class="doc-group-toggle">▼</span></div></div>';
    html += '<div class="doc-group-body"><table class="table"><thead><tr><th>ID</th><th>物品</th><th>数量</th><th>借出日期</th><th>预计归还</th><th>操作</th></tr></thead><tbody>';
    for (const r of doc.items) {
      html += '<tr><td>' + r.id + '</td><td>' + escapeHtml(r.item_name || '') + '</td><td>' + r.quantity + '</td><td>' + (r.borrow_date || '') + '</td><td>' + (r.expected_return_date || '') + '</td>';
      html += '<td><div class="btn-group"><button class="btn btn-success btn-sm" onclick="doApproveWithConfirm(' + r.id + ')">通过</button><button class="btn btn-danger btn-sm" onclick="showRejectDialogForId(' + r.id + ')">驳回</button></div></td></tr>';
    }
    html += '</tbody></table></div></div>';
  }

  for (const g of trDocs) {
    html += '<div class="doc-group">';
    html += '<div class="doc-group-header" onclick="toggleDocGroup(this)">';
    html += '<div class="doc-group-meta">';
    html += '<strong>' + escapeHtml(g.document_no || '') + '</strong>';
    html += '<span class="status-badge pending" style="font-size:11px;">仓库调拨</span>';
    html += '<span><i class="bi bi-building"></i> ' + escapeHtml(g.from_warehouse_name || '') + ' <i class="bi bi-arrow-right"></i> ' + escapeHtml(g.to_warehouse_name || '') + '</span>';
    html += '<span>' + g.count + ' 件物品</span>';
    html += '<span>' + escapeHtml(g.created_by_name || '') + '</span>';
    html += '<span>' + (g.created_at || '') + '</span>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    html += '<button class="btn btn-success btn-sm" onclick="event.stopPropagation();approveTransferDocument(\'' + escapeHtml(g.document_no || '') + '\')">全部通过</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();showRejectTransferDialog(\'' + escapeHtml(g.document_no || '') + '\')">全部驳回</button>';
    html += '<span class="doc-group-toggle">▼</span></div></div>';
    html += '<div class="doc-group-body"><table class="table"><thead><tr><th>ID</th><th>物品</th><th>源→目标</th><th>数量</th><th>操作</th></tr></thead><tbody>';
    for (const t of g.items) {
      html += '<tr><td>' + t.id + '</td><td>' + escapeHtml(t.item_name || '') + '</td>';
      html += '<td>' + escapeHtml(t.from_warehouse_name || '') + ' <i class="bi bi-arrow-right"></i> ' + escapeHtml(t.to_warehouse_name || '') + '</td>';
      html += '<td>' + t.quantity + '</td>';
      html += '<td><div class="btn-group"><button class="btn btn-success btn-sm" onclick="doApproveTransfer(' + t.id + ')">通过</button><button class="btn btn-danger btn-sm" onclick="showRejectTransferForId(' + t.id + ')">驳回</button></div></td></tr>';
    }
    html += '</tbody></table></div></div>';
  }

  container.innerHTML = html;
  const pages = Math.ceil((recDocs.length + trDocs.length) / 15);
  if (pages > 1) {
    let pg = '<div class="pagination">';
    pg += '<button onclick="loadApprovals(' + (approvalPage - 1) + ')" ' + (approvalPage === 1 ? 'disabled' : '') + '>上一页</button>';
    for (let i = 1; i <= pages; i++) pg += '<button class="' + (i === approvalPage ? 'active' : '') + '" onclick="loadApprovals(' + i + ')">' + i + '</button>';
    pg += '<button onclick="loadApprovals(' + (approvalPage + 1) + ')" ' + (approvalPage === pages ? 'disabled' : '') + '>下一页</button></div>';
    container.innerHTML += pg;
  }
}

document.addEventListener('DOMContentLoaded', () => { loadStats(); loadApprovals(1); });
</script>
{% endblock %}
