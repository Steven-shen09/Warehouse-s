{% extends "base.html" %}
{% block title %}消耗品领用 - Warehouse-s{% endblock %}
{% block content %}
<h2>消耗品领用管理</h2>

<div class="card" style="margin-bottom: 20px;">
  <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <select id="statusFilter" class="form-input" style="max-width: 120px;" onchange="loadRecords()">
      <option value="">全部状态</option>
      <option value="待审核">待审核</option>
      <option value="已领取">已领取</option>
      <option value="已拒绝">已拒绝</option>
    </select>
    <button class="btn btn-primary" onclick="openPickupModal()"><i class="bi bi-cart-plus"></i> 领用申请</button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-wrapper">
      <table class="table">
        <thead><tr><th>单号</th><th>物品</th><th>数量</th><th>领用人</th><th>仓库</th><th>日期</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="recordTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;"></div>
  </div>
</div>

<!-- 领用申请模态框 -->
<div class="modal-overlay" id="pickup-modal">
  <div class="modal" style="max-width: 600px;">
    <div class="modal-header"><span>消耗品领用申请</span><button class="btn btn-outline btn-sm" onclick="closeModal('pickup-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">消耗品 *</label><select id="pickupItem" class="form-input" onchange="onItemChange()"></select></div>
      <div class="form-group"><label class="form-label">数量 *</label><input type="number" id="pickupQty" class="form-input" min="1" value="1" style="max-width: 120px;"></div>
      <div class="form-group"><label class="form-label">仓库 *</label><select id="pickupWarehouse" class="form-input"></select></div>
      <div class="form-group"><label class="form-label">领用日期 *</label><input type="date" id="pickupDate" class="form-input"></div>
      <div class="form-group"><label class="form-label">事由</label><input type="text" id="pickupReason" class="form-input"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('pickup-modal')">取消</button>
      <button class="btn btn-primary" onclick="submitPickup()">提交申请</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function initPickupForm() {
  const [itemsRes, warehousesRes] = await Promise.all([
    api('/api/v1/items?page_size=500&item_type=consumable'),
    api('/api/v1/warehouses')
  ]);
  // 筛选消耗品
  const consumables = (itemsRes.items || []).filter(i => i.item_type === 'consumable');
  window._consumables = consumables;
  document.getElementById('pickupItem').innerHTML = consumables.map(i => `<option value="${i.id}">${esc(i.name)}（可用：${i.available_quantity}）</option>`).join('');
  document.getElementById('pickupWarehouse').innerHTML = warehouses.warehouses.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
}

function onItemChange() {
  const itemId = parseInt(document.getElementById('pickupItem').value);
  const item = (window._consumables || []).find(i => i.id === itemId);
  if (item && item.warehouse_stocks && item.warehouse_stocks.length > 0) {
    document.getElementById('pickupWarehouse').value = item.warehouse_stocks[0].warehouse_id;
  }
}

async function loadRecords(page = 1) {
  currentPage = page;
  const st = document.getElementById('statusFilter').value;
  const res = await api(`/api/v1/consumable-records?status=${st}&page=${page}`);
  document.getElementById('recordTableBody').innerHTML = res.records.map(r => `
    <tr>
      <td><span class="status-badge">${esc(r.document_no)}</span></td>
      <td>${esc(r.item_name)}</td><td>${r.quantity}</td><td>${esc(r.user_name)}</td>
      <td>${esc(r.warehouse_name)}</td><td>${r.pickup_date}</td>
      <td><span class="status-badge ${r.status === '已领取' ? 'returned' : r.status === '已拒绝' ? 'rejected' : 'pending'}">${r.status}</span></td>
      <td>
        {% if current_user.role in ('admin', 'approver') %}
        ${r.status === '待审核' ? `<button class="btn btn-success btn-sm" onclick="approveRecord(${r.id})">通过</button><button class="btn btn-danger btn-sm" onclick="rejectRecord(${r.id})">驳回</button>` : ''}
        {% endif %}
      </td>
    </tr>`).join('');
  renderPagination(res.total, page, 'loadRecords');
}

function openPickupModal() {
  document.getElementById('pickupDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('pickupQty').value = 1;
  document.getElementById('pickupReason').value = '';
  initPickupForm();
  openModal('pickup-modal');
}

async function submitPickup() {
  const itemId = parseInt(document.getElementById('pickupItem').value);
  const qty = parseInt(document.getElementById('pickupQty').value);
  const wid = parseInt(document.getElementById('pickupWarehouse').value);
  const pdate = document.getElementById('pickupDate').value;
  const reason = document.getElementById('pickupReason').value;
  if (!itemId || !qty || !wid || !pdate) { showToast('请完整填写信息', 'error'); return; }
  try {
    const res = await api(`/api/v1/consumable-records?item_id=${itemId}&quantity=${qty}&source_warehouse_id=${wid}&pickup_date=${pdate}&reason=${encodeURIComponent(reason)}`, 'POST');
    showToast(`领用申请已提交（${res.document_no}）`);
    closeModal('pickup-modal');
    loadRecords();
  } catch(e) { showToast('提交失败：' + (e.message || ''), 'error'); }
}

async function approveRecord(id) {
  showConfirmDialog('审核通过', '确认通过该领用申请？（库存将被永久扣减）', async () => {
    await api(`/api/v1/consumable-records/${id}/approve`, 'PUT');
    showToast('领用已通过，库存已扣减');
    loadRecords(currentPage);
  });
}

async function rejectRecord(id) {
  showConfirmDialog('驳回申请', '<textarea id="rejectComment" class="form-input" rows="2" placeholder="请填写驳回原因"></textarea>', async () => {
    const comment = document.getElementById('rejectComment').value;
    if (!comment) { showToast('请填写驳回原因', 'error'); return; }
    await api(`/api/v1/consumable-records/${id}/reject?comment=${encodeURIComponent(comment)}`, 'PUT');
    showToast('已驳回'); loadRecords(currentPage);
  }, { html: true });
}

document.addEventListener('DOMContentLoaded', () => loadRecords());
</script>
{% endblock %}
