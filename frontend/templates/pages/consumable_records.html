{% extends "base.html" %}
{% block title %}耗材领用记录 - Warehouse-s{% endblock %}
{% block content %}
<h2>耗材领用记录</h2>

<div class="card" style="margin-bottom: 20px;">
  <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <select id="statusFilter" class="form-input" style="max-width: 120px;" onchange="loadRecords()">
      <option value="">全部状态</option>
      <option value="待审核">待审核</option>
      <option value="已领取">已领取</option>
      <option value="已拒绝">已拒绝</option>
    </select>
  </div>
</div>

<div id="records-container">
  <div style="text-align:center;padding:48px;color:var(--text-muted);">加载中...</div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-header"><span id="confirm-title">确认操作</span><button class="btn btn-outline btn-sm" onclick="closeModal('confirm-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body"><p id="confirm-message" style="color:var(--text-secondary);"></p><div id="confirm-extra"></div></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-success" id="confirm-btn">确认</button>
    </div>
  </div>
</div>

<!-- 驳回弹窗 -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <div class="modal-header"><span id="reject-title">驳回申请</span><button class="btn btn-outline btn-sm" onclick="closeModal('reject-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <p id="reject-message" style="color:var(--text-secondary);"></p>
      <div class="form-group" style="margin-top:12px;"><label class="form-label">驳回原因 *</label><textarea id="reject-reason" class="form-input" rows="2" placeholder="请填写驳回原因（必填）"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reject-modal')">取消</button>
      <button class="btn btn-danger" id="reject-btn">确认驳回</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let _confirmCb = null, _rejectCb = null;

document.getElementById('confirm-btn').addEventListener('click', () => {
  if (_confirmCb) { closeModal('confirm-modal'); _confirmCb(); _confirmCb = null; }
});
document.getElementById('reject-btn').addEventListener('click', () => {
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { showToast('请填写驳回原因', 'error'); return; }
  if (_rejectCb) { closeModal('reject-modal'); _rejectCb(reason); _rejectCb = null; }
});

function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = msg;
  document.getElementById('confirm-extra').innerHTML = '';
  _confirmCb = cb;
  openModal('confirm-modal');
}

function showReject(title, msg, cb) {
  document.getElementById('reject-title').textContent = title;
  document.getElementById('reject-message').textContent = msg;
  document.getElementById('reject-reason').value = '';
  _rejectCb = cb;
  openModal('reject-modal');
}

function toggleDocGroup(h) {
  const b = h.nextElementSibling, t = h.querySelector('.doc-group-toggle');
  if (b.style.display === 'none') { b.style.display = ''; t.textContent = '▼'; }
  else { b.style.display = 'none'; t.textContent = '▶'; }
}

async function loadRecords() {
  const st = document.getElementById('statusFilter').value;
  const r = await api(`/api/v1/consumable-records?status=${encodeURIComponent(st)}&page_size=200`);
  const data = await r.json();
  const records = data.records || [];

  const container = document.getElementById('records-container');
  if (records.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon"><i class="bi bi-inbox"></i></div><p>暂无耗材领用记录</p></div>';
    return;
  }

  // 按单据号分组
  const groups = {};
  for (const rec of records) {
    const key = rec.document_no || 'LY-' + rec.id;
    if (!groups[key]) {
      groups[key] = {
        document_no: key,
        user_name: rec.user_name,
        pickup_date: rec.pickup_date,
        items: [],
        count: 0,
        anyPending: false,
        allRejected: true,
        allPicked: true,
      };
    }
    groups[key].items.push(rec);
    groups[key].count += rec.quantity;
    if (rec.status === '待审核') groups[key].anyPending = true;
    if (rec.status !== '已拒绝') groups[key].allRejected = false;
    if (rec.status !== '已领取') groups[key].allPicked = false;
  }

  let html = '';
  for (const [docNo, g] of Object.entries(groups)) {
    const gStatus = g.allPicked ? '已领取' : (g.allRejected ? '已拒绝' : (g.anyPending ? '待审核' : '已领取'));
    const badgeClass = gStatus === '已领取' ? 'returned' : (gStatus === '已拒绝' ? 'rejected' : 'pending');

    html += '<div class="doc-group">';
    html += '<div class="doc-group-header" onclick="toggleDocGroup(this)">';
    html += '<div class="doc-group-meta">';
    html += '<strong>单据号: ' + esc(g.document_no) + '</strong>';
    html += '<span class="status-badge ' + badgeClass + '" style="font-size:11px;">' + gStatus + '</span>';
    html += '<span>申领人: ' + esc(g.user_name || '') + '</span>';
    html += '<span>' + g.items.length + ' 种物品 / 共 ' + g.count + ' 件</span>';
    html += '<span>' + (g.pickup_date || '') + '</span>';
    html += '</div>';
    html += '<span class="doc-group-toggle">▼</span></div>';
    html += '<div class="doc-group-body"><table class="table"><thead><tr><th>物品</th><th>仓库</th><th>数量</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    for (const rec of g.items) {
      html += '<tr>';
      html += '<td>' + esc(rec.item_name || '') + '</td>';
      html += '<td>' + esc(rec.warehouse_name || '-') + '</td>';
      html += '<td>' + rec.quantity + '</td>';
      html += '<td><span class="status-badge ' + (rec.status === '已领取' ? 'returned' : rec.status === '已拒绝' ? 'rejected' : 'pending') + '">' + rec.status + '</span></td>';
      html += '<td>';
      {% if current_user.role in ('admin', 'approver') %}
      if (rec.status === '待审核') {
        html += '<button class="btn btn-success btn-sm" onclick="approveRecord(' + rec.id + ')">通过</button> ';
        html += '<button class="btn btn-danger btn-sm" onclick="rejectRecord(' + rec.id + ')">驳回</button>';
      }
      {% endif %}
      html += '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }
  container.innerHTML = html;
}

async function approveRecord(id) {
  showConfirm('确认通过', '确定通过该耗材领用申请？（库存将被永久扣减）', async () => {
    const r = await api('/api/v1/consumable-records/' + id + '/approve?comment=', { method: 'PUT' });
    const d = await r.json();
    if (r.ok) { showToast(d.message || '已通过'); loadRecords(); }
    else { showToast(d.detail || '操作失败', 'error'); }
  });
}

async function rejectRecord(id) {
  showReject('驳回领用', '确定驳回该耗材领用申请吗？', async (reason) => {
    const r = await api('/api/v1/consumable-records/' + id + '/reject?comment=' + encodeURIComponent(reason), { method: 'PUT' });
    const d = await r.json();
    if (r.ok) { showToast(d.message || '已驳回'); loadRecords(); }
    else { showToast(d.detail || '操作失败', 'error'); }
  });
}

document.addEventListener('DOMContentLoaded', () => loadRecords());
</script>
{% endblock %}
