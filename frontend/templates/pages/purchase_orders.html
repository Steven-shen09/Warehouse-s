{% extends "base.html" %}
{% block title %}采购入库 - Warehouse-s{% endblock %}
{% block content %}
<h2>采购入库管理</h2>

<div class="card" style="margin-bottom: 20px;">
  <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <select id="statusFilter" class="form-input" style="max-width: 140px;" onchange="loadOrders()">
      <option value="">全部状态</option>
      <option value="待审核">待审核</option>
      <option value="已入库">已入库</option>
      <option value="已取消">已取消</option>
    </select>
    <button class="btn btn-primary" onclick="openCreateModal()"><i class="bi bi-plus-lg"></i> 新建采购单</button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-wrapper">
      <table class="table">
        <thead><tr><th>单号</th><th>供应商</th><th>仓库</th><th>采购日期</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;"></div>
  </div>
</div>

<!-- 新建采购单模态框 -->
<div class="modal-overlay" id="po-modal">
  <div class="modal" style="max-width: 700px;">
    <div class="modal-header"><span>新建采购单</span><button class="btn btn-outline btn-sm" onclick="closeModal('po-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
        <div class="form-group" style="flex:1; min-width: 160px;">
          <label class="form-label">供应商 *</label><select id="poSupplier" class="form-input"></select>
        </div>
        <div class="form-group" style="flex:1; min-width: 160px;">
          <label class="form-label">仓库 *</label><select id="poWarehouse" class="form-input"></select>
        </div>
        <div class="form-group" style="flex:1; min-width: 140px;">
          <label class="form-label">采购日期 *</label><input type="date" id="poDate" class="form-input">
        </div>
      </div>
      <div class="form-group"><label class="form-label">备注</label><input type="text" id="poNotes" class="form-input"></div>
      <hr style="margin: 16px 0; border-color: var(--bg);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong>采购明细</strong>
        <button class="btn btn-outline btn-sm" onclick="addPOLine()"><i class="bi bi-plus"></i> 添加物品</button>
      </div>
      <div id="poLines"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('po-modal')">取消</button>
      <button class="btn btn-primary" onclick="submitPO()">提交采购单</button>
    </div>
  </div>
</div>

<!-- 详情模态框 -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width: 700px;">
    <div class="modal-header"><span>采购单详情</span><button class="btn btn-outline btn-sm" onclick="closeModal('detail-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let poLines = [];

async function initSelects() {
  const [suppliers, warehouses, items] = await Promise.all([
    api('/api/v1/suppliers?page_size=100'),
    api('/api/v1/warehouses'),
    api('/api/v1/items?page_size=500')
  ]);
  document.getElementById('poSupplier').innerHTML = suppliers.suppliers.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  document.getElementById('poWarehouse').innerHTML = warehouses.warehouses.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
  // 存储物品列表供采购行使用
  window._items = items.items;
}

function addPOLine() {
  const items = window._items || [];
  const options = items.map(i => `<option value="${i.id}">${esc(i.name)} (${i.item_type === 'consumable' ? '消耗品' : i.item_type === 'fixed_asset' ? '固定资产' : '工具'})</option>`).join('');
  const idx = poLines.length;
  poLines.push({ item_id: 0, quantity: 1, unit_price: 0, batch_no: '' });
  renderPOLines();
}

function renderPOLines() {
  const items = window._items || [];
  document.getElementById('poLines').innerHTML = poLines.map((l, i) => `
    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
      <select class="form-input" style="flex:2; min-width: 180px;" onchange="poLines[${i}].item_id=parseInt(this.value)">
        <option value="">选择物品</option>
        ${items.map(it => `<option value="${it.id}" ${it.id === l.item_id ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}
      </select>
      <input type="number" class="form-input" style="width:80px;" value="${l.quantity}" min="1" onchange="poLines[${i}].quantity=parseInt(this.value)||1" placeholder="数量">
      <input type="number" class="form-input" style="width:100px;" value="${l.unit_price}" min="0" step="0.01" onchange="poLines[${i}].unit_price=parseFloat(this.value)||0" placeholder="单价">
      <input type="text" class="form-input" style="width:100px;" value="${l.batch_no}" onchange="poLines[${i}].batch_no=this.value" placeholder="批次号">
      <button class="btn btn-danger btn-sm" onclick="poLines.splice(${i},1);renderPOLines()"><i class="bi bi-trash"></i></button>
    </div>`).join('');
}

async function loadOrders(page = 1) {
  currentPage = page;
  const st = document.getElementById('statusFilter').value;
  const res = await api(`/api/v1/purchase-orders?status=${st}&page=${page}`);
  document.getElementById('orderTableBody').innerHTML = res.orders.map(o => `
    <tr>
      <td><span class="status-badge">${esc(o.document_no)}</span></td>
      <td>${esc(o.supplier_name)}</td><td>${esc(o.warehouse_name)}</td>
      <td>${o.purchase_date}</td><td>¥${o.total_amount.toFixed(2)}</td>
      <td><span class="status-badge ${o.status === '已入库' ? 'returned' : o.status === '已取消' ? 'rejected' : 'pending'}">${o.status}</span></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick='showDetail(${JSON.stringify(o).replace(/'/g, "&#39;")})'><i class="bi bi-eye"></i></button>
        ${o.status === '待审核' ? `<button class="btn btn-success btn-sm" onclick="approvePO(${o.id})">入库</button><button class="btn btn-danger btn-sm" onclick="cancelPO(${o.id})">取消</button>` : ''}
      </td>
    </tr>`).join('');
  renderPagination(res.total, page, 'loadOrders');
}

function showDetail(o) {
  document.getElementById('detailBody').innerHTML = `
    <p><strong>单号：</strong>${esc(o.document_no)} | <strong>供应商：</strong>${esc(o.supplier_name)} | <strong>仓库：</strong>${esc(o.warehouse_name)}</p>
    <p><strong>日期：</strong>${o.purchase_date} | <strong>金额：</strong>¥${o.total_amount.toFixed(2)}</p>
    <table class="table"><thead><tr><th>物品</th><th>类型</th><th>数量</th><th>单价</th><th>批次号</th></tr></thead>
    <tbody>${(o.items||[]).map(i => `<tr><td>${esc(i.item_name)}</td><td>${esc(i.item_type)}</td><td>${i.quantity}</td><td>¥${i.unit_price.toFixed(2)}</td><td>${esc(i.batch_no||'-')}</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('detailFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal(\'detail-modal\')">关闭</button>';
  openModal('detail-modal');
}

async function openCreateModal() {
  document.getElementById('poDate').value = new Date().toISOString().slice(0,10);
  poLines = [];
  renderPOLines();
  await initSelects();
  openModal('po-modal');
}

async function submitPO() {
  const sid = parseInt(document.getElementById('poSupplier').value);
  const wid = parseInt(document.getElementById('poWarehouse').value);
  const pdate = document.getElementById('poDate').value;
  if (!sid || !wid || !pdate) { showToast('请完整填写供应商、仓库和采购日期', 'error'); return; }
  if (poLines.length === 0) { showToast('请添加采购明细', 'error'); return; }
  for (const l of poLines) { if (!l.item_id) { showToast('请选择所有采购物品', 'error'); return; } }
  const body = { supplier_id: sid, warehouse_id: wid, purchase_date: pdate, notes: document.getElementById('poNotes').value, items: poLines };
  try {
    const res = await api('/api/v1/purchase-orders', 'POST', body);
    showToast(`采购单 ${res.document_no} 创建成功`);
    closeModal('po-modal');
    loadOrders();
  } catch(e) { showToast('创建失败：' + (e.message || ''), 'error'); }
}

async function approvePO(id) {
  showConfirmDialog('确认入库', '审核通过后将自动更新库存，确认？', async () => {
    await api(`/api/v1/purchase-orders/${id}/approve`, 'PUT');
    showToast('采购单已入库');
    loadOrders(currentPage);
  });
}

async function cancelPO(id) {
  showConfirmDialog('取消采购单', '确认取消该采购单？', async () => {
    await api(`/api/v1/purchase-orders/${id}/cancel`, 'PUT');
    showToast('采购单已取消');
    loadOrders(currentPage);
  });
}

document.addEventListener('DOMContentLoaded', () => { loadOrders(); initSelects(); });
</script>
{% endblock %}
