{% extends "base.html" %}
{% block title %}采购入库 - Warehouse-s{% endblock %}
{% block content %}
<h2>采购入库管理</h2>

<div class="card" style="margin-bottom: 20px;">
  <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <select id="statusFilter" class="form-input" style="max-width: 140px;" onchange="loadOrders()">
      <option value="">全部状态</option>
      <option value="待审核">待审核</option>
      <option value="已入库">已入库</option>
      <option value="已取消">已取消</option>
    </select>
    <button class="btn btn-primary" onclick="openCreateModal()"><i class="bi bi-plus-lg"></i> 新建采购单</button>
    <button class="btn btn-outline" onclick="openImportModal()"><i class="bi bi-upload"></i> 导入采购单</button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-wrapper">
      <table class="table">
        <thead><tr><th>单号</th><th>供应商</th><th>仓库</th><th>采购日期</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;"></div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-header"><span id="confirm-title">确认操作</span><button class="btn btn-outline btn-sm" onclick="closeModal('confirm-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body"><p id="confirm-message" style="color:var(--text-secondary);"></p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-success" id="confirm-btn">确认</button>
    </div>
  </div>
</div>

<!-- 新建采购单模态框 -->
<div class="modal-overlay" id="po-modal">
  <div class="modal" style="max-width: 800px;">
    <div class="modal-header"><span>新建采购单</span><button class="btn btn-outline btn-sm" onclick="closeModal('po-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
        <div class="form-group" style="flex:1; min-width: 180px; position:relative;">
          <label class="form-label">供应商 *</label>
          <input type="text" id="poSupplier" class="form-input" placeholder="输入供应商名称" autocomplete="off" oninput="suggest(this, window._suppliers||[], 'supplierSuggest')" onfocus="suggest(this, window._suppliers||[], 'supplierSuggest')" onblur="setTimeout(()=>document.getElementById('supplierSuggest').innerHTML='',150)">
          <div id="supplierSuggest" class="suggest-dropdown"></div>
        </div>
        <div class="form-group" style="flex:1; min-width: 180px;">
          <label class="form-label">仓库 *</label><select id="poWarehouse" class="form-input"></select>
        </div>
        <div class="form-group" style="flex:1; min-width: 160px;">
          <label class="form-label">采购日期 *</label><input type="date" id="poDate" class="form-input">
        </div>
      </div>
      <div class="form-group"><label class="form-label">备注</label><input type="text" id="poNotes" class="form-input"></div>
      <hr style="margin: 16px 0; border-color: var(--bg);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong>采购明细</strong>
        <button class="btn btn-outline btn-sm" onclick="addPOLine()"><i class="bi bi-plus"></i> 添加物品</button>
      </div>
      <div id="poLines"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('po-modal')">取消</button>
      <button class="btn btn-primary" onclick="submitPO()">提交采购单</button>
    </div>
  </div>
</div>

<!-- 导入采购单模态框 -->
<div class="modal-overlay" id="import-modal">
  <div class="modal" style="max-width: 700px;">
    <div class="modal-header"><span>导入采购单</span><button class="btn btn-outline btn-sm" onclick="closeModal('import-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
        <div class="form-group" style="flex:1; min-width: 180px; position:relative;">
          <label class="form-label">供应商 *</label>
          <input type="text" id="impSupplier" class="form-input" placeholder="输入供应商名称" autocomplete="off" oninput="suggest(this, window._suppliers||[], 'importSuppSuggest')" onfocus="suggest(this, window._suppliers||[], 'importSuppSuggest')" onblur="setTimeout(()=>document.getElementById('importSuppSuggest').innerHTML='',150)">
          <div id="importSuppSuggest" class="suggest-dropdown"></div>
        </div>
        <div class="form-group" style="flex:1; min-width: 180px;">
          <label class="form-label">仓库 *</label><select id="impWarehouse" class="form-input"></select>
        </div>
        <div class="form-group" style="flex:1; min-width: 160px;">
          <label class="form-label">采购日期 *</label><input type="date" id="impDate" class="form-input">
        </div>
      </div>
      <div class="form-group"><label class="form-label">备注</label><input type="text" id="impNotes" class="form-input"></div>
      <hr style="margin: 16px 0; border-color: var(--bg);">
      <div class="form-group">
        <label class="form-label">
          CSV (名称,分类,规格,品牌,数量,单价,批次)
          <a href="#" onclick="downloadTemplate();return false;" style="font-size:12px;color:var(--primary);margin-left:8px;">下载模板</a>
        </label>
        <input type="file" id="impFile" class="form-input" accept=".csv" onchange="previewImport()">
      </div>
      <div id="importPreview" style="margin-top:12px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('import-modal')">取消</button>
      <button class="btn btn-primary" onclick="submitImport()">导入</button>
    </div>
  </div>
</div>

<!-- 详情模态框 -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width: 700px;">
    <div class="modal-header"><span>采购单详情</span><button class="btn btn-outline btn-sm" onclick="closeModal('detail-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let poLines = [];
let importLines = [];
let _confirmCb = null;

document.getElementById('confirm-btn').addEventListener('click', () => {
  if (_confirmCb) { closeModal('confirm-modal'); _confirmCb(); _confirmCb = null; }
});
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = msg;
  _confirmCb = cb; openModal('confirm-modal');
}

// ── 自定义建议列表 ──
function suggest(input, sourceList, dropdownId) {
  const dd = document.getElementById(dropdownId);
  const val = input.value.toLowerCase().trim();
  if (!val) { dd.innerHTML = ''; return; }
  const matches = sourceList.filter(s => s.name.toLowerCase().includes(val)).slice(0, 6);
  if (matches.length === 0) { dd.innerHTML = ''; return; }
  dd.innerHTML = matches.map(s => `<div class="suggest-item" onmousedown="event.preventDefault();this.closest('input')||document.getElementById('${input.id}');document.getElementById('${input.id}').value='${esc(s.name).replace(/'/g,"&#39;")}';document.getElementById('${dropdownId}').innerHTML=''">${esc(s.name)}</div>`).join('');
}
// 点击建议项填入
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('suggest-item')) {
    const input = e.target.parentElement.previousElementSibling;
    if (input && input.tagName === 'INPUT') {
      input.value = e.target.textContent;
      input.focus();
    }
    e.target.parentElement.innerHTML = '';
  }
});
// 行内物品建议
function suggestLine(input, idx) {
  const val = input.value.toLowerCase().trim();
  const items = window._items || [];
  if (!val) return;
  const matches = items.filter(i => i.name.toLowerCase().includes(val)).slice(0, 5);
  // 找到或创建建议列表
  let dd = input.nextElementSibling;
  if (!dd || !dd.classList.contains('suggest-dropdown')) {
    dd = document.createElement('div'); dd.className = 'suggest-dropdown';
    input.parentElement.appendChild(dd);
  }
  if (matches.length === 0) { dd.innerHTML = ''; return; }
  dd.innerHTML = matches.map(s => `<div class="suggest-item" onmousedown="event.preventDefault();var inp=document.getElementById('itemName${idx}');inp.value='${esc(s.name).replace(/'/g,"&#39;")}';poLines[${idx}].item_name='${esc(s.name).replace(/'/g,"&#39;")}';poLines[${idx}].category='${esc(s.category||'').replace(/'/g,"&#39;")}';poLines[${idx}].specification='${esc(s.specification||'').replace(/'/g,"&#39;")}';poLines[${idx}].brand='${esc(s.brand||'').replace(/'/g,"&#39;")}';this.parentElement.innerHTML='';">${esc(s.name)} <span style="color:var(--text-muted);font-size:12px;">${esc(s.category||'')} ${esc(s.brand||'')}</span></div>`).join('');
}

async function initSelects() {
  const [suppliersR, warehousesR, itemsR] = await Promise.all([
    api('/api/v1/suppliers?page_size=200'),
    api('/api/v1/warehouses'),
    api('/api/v1/items?page_size=1000')
  ]);
  const suppliers = await suppliersR.json();
  const warehouses = await warehousesR.json();
  const items = await itemsR.json();
  document.getElementById('poWarehouse').innerHTML = (warehouses.warehouses||[]).map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
  document.getElementById('impWarehouse').innerHTML = document.getElementById('poWarehouse').innerHTML;
  window._suppliers = suppliers.suppliers || [];
  window._items = items.items || [];
}

function findItem(name) { const n = name.toLowerCase().trim(); return (window._items||[]).find(i => i.name.toLowerCase() === n); }
function findSupplier(name) { const n = name.toLowerCase().trim(); return (window._suppliers||[]).find(s => s.name.toLowerCase() === n); }

async function ensureItem(name, category, spec, brand) {
  const existing = findItem(name);
  if (existing) return existing;
  const params = new URLSearchParams({ name, item_type:'tool', category:category||'', specification:spec||'', brand:brand||'', total_quantity:0, value:0 });
  const r = await api(`/api/v1/items/?${params.toString()}`, { method:'POST' });
  if (r.ok) {
    const itemsR = await api('/api/v1/items?page_size=1000');
    window._items = (await itemsR.json()).items || [];
    return findItem(name);
  }
  const d = await r.json();
  throw new Error(d.detail || '创建物品失败');
}

async function ensureSupplier(name) {
  const existing = findSupplier(name);
  if (existing) return existing.id;
  const r = await api(`/api/v1/suppliers/?name=${encodeURIComponent(name)}`, { method:'POST' });
  const d = await r.json();
  if (r.ok && d.id) { window._suppliers.push({ id:d.id, name }); return d.id; }
  const r2 = await api('/api/v1/suppliers?page_size=200');
  window._suppliers = (await r2.json()).suppliers || [];
  const found = findSupplier(name);
  return found ? found.id : 0;
}

function addPOLine() {
  poLines.push({ item_name:'', category:'', specification:'', brand:'', quantity:1, unit_price:0, batch_no:'' });
  renderPOLines();
}

function renderPOLines() {
  document.getElementById('poLines').innerHTML = poLines.map((l, i) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;padding:8px;background:var(--bg);border-radius:8px;position:relative;">
      <div style="position:relative;flex:1.5;min-width:140px;">
        <input type="text" id="itemName${i}" class="form-input" value="${esc(l.item_name||'')}" placeholder="物品名称" autocomplete="off"
          oninput="poLines[${i}].item_name=this.value;suggestLine(this,${i})"
          onfocus="suggestLine(this,${i})"
          onblur="setTimeout(()=>{var n=this.nextElementSibling;if(n&&n.classList.contains('suggest-dropdown'))n.innerHTML=''},150)">
      </div>
      <input type="text" class="form-input" style="width:80px;" value="${esc(l.category||'')}" onchange="poLines[${i}].category=this.value" placeholder="分类">
      <input type="text" class="form-input" style="width:90px;" value="${esc(l.specification||'')}" onchange="poLines[${i}].specification=this.value" placeholder="规格">
      <input type="text" class="form-input" style="width:80px;" value="${esc(l.brand||'')}" onchange="poLines[${i}].brand=this.value" placeholder="品牌">
      <input type="number" class="form-input" style="width:70px;" value="${l.quantity}" min="1" onchange="poLines[${i}].quantity=parseInt(this.value)||1" placeholder="数量">
      <input type="number" class="form-input" style="width:90px;" value="${l.unit_price}" min="0" step="0.01" onchange="poLines[${i}].unit_price=parseFloat(this.value)||0" placeholder="单价">
      <input type="text" class="form-input" style="width:80px;" value="${l.batch_no}" onchange="poLines[${i}].batch_no=this.value" placeholder="批次">
      <button class="btn btn-danger btn-sm" onclick="poLines.splice(${i},1);renderPOLines()"><i class="bi bi-trash"></i></button>
    </div>`).join('');
}

async function loadOrders(page = 1) {
  currentPage = page; const st = document.getElementById('statusFilter').value;
  const r = await api(`/api/v1/purchase-orders/?status=${encodeURIComponent(st)}&page=${page}`);
  const data = await r.json();
  document.getElementById('orderTableBody').innerHTML = data.orders.map(o => `
    <tr><td><span class="status-badge">${esc(o.document_no)}</span></td><td>${esc(o.supplier_name)}</td><td>${esc(o.warehouse_name)}</td><td>${o.purchase_date}</td><td>${(o.total_amount||0).toFixed(2)}</td>
      <td><span class="status-badge ${o.status==='已入库'?'returned':o.status==='已取消'?'rejected':'pending'}">${o.status}</span></td>
      <td><button class="btn btn-outline btn-sm" onclick='showDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'><i class="bi bi-eye"></i></button>
        ${o.status==='待审核'?`<button class="btn btn-success btn-sm" onclick="approvePO(${o.id})">入库</button><button class="btn btn-danger btn-sm" onclick="cancelPO(${o.id})">取消</button>`:''}</td></tr>`).join('');
  renderPagination(data.total, page, 'loadOrders');
}

function showDetail(o) {
  document.getElementById('detailBody').innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">单号</label><div class="form-input" style="background:var(--bg);">${esc(o.document_no)}</div></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">供应商</label><div class="form-input" style="background:var(--bg);">${esc(o.supplier_name)}</div></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">仓库</label><div class="form-input" style="background:var(--bg);">${esc(o.warehouse_name)}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">日期</label><div class="form-input" style="background:var(--bg);">${o.purchase_date}</div></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">金额</label><div class="form-input" style="background:var(--bg);">${(o.total_amount||0).toFixed(2)}</div></div>
    </div>
    <div class="card-title" style="margin-bottom:8px;">采购明细</div>
    <table class="table"><thead><tr><th>物品</th><th>分类</th><th>规格</th><th>品牌</th><th>数量</th><th>单价</th><th>批次</th></tr></thead>
    <tbody>${(o.items||[]).map(i => `<tr><td>${esc(i.item_name)}</td><td>${esc(i.item_type||'-')}</td><td>${esc(i.specification||'-')}</td><td>${esc(i.brand||'-')}</td><td>${i.quantity}</td><td>${(i.unit_price||0).toFixed(2)}</td><td>${esc(i.batch_no||'-')}</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('detailFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal(\'detail-modal\')">关闭</button>';
  openModal('detail-modal');
}

async function openCreateModal() {
  document.getElementById('poSupplier').value = '';
  document.getElementById('poDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('poNotes').value = '';
  poLines = []; renderPOLines();
  await initSelects();
  openModal('po-modal');
}

async function submitPO() {
  const sname = document.getElementById('poSupplier').value.trim();
  const wid = parseInt(document.getElementById('poWarehouse').value);
  const pdate = document.getElementById('poDate').value;
  if (!sname || !wid || !pdate) { showToast('请填写供应商、仓库和日期', 'error'); return; }
  if (poLines.length === 0) { showToast('请添加采购明细', 'error'); return; }
  const sid = await ensureSupplier(sname);
  if (!sid) { showToast('无法创建供应商', 'error'); return; }
  const items = [];
  for (const l of poLines) {
    if (!l.item_name) { showToast('请填写所有物品名称', 'error'); return; }
    try { const it = await ensureItem(l.item_name, l.category, l.specification, l.brand); items.push({ item_id:it.id, quantity:l.quantity, unit_price:l.unit_price, batch_no:l.batch_no }); }
    catch(e) { showToast(e.message, 'error'); return; }
  }
  const body = { supplier_id:sid, warehouse_id:wid, purchase_date:pdate, notes:document.getElementById('poNotes').value, items };
  try {
    const r = await api('/api/v1/purchase-orders/', { method:'POST', body:JSON.stringify(body) });
    const d = await r.json();
    if (r.ok) { showToast(`采购单 ${d.document_no} 创建成功`); closeModal('po-modal'); loadOrders(); }
    else { showToast(d.detail||'创建失败', 'error'); }
  } catch(e) { showToast('创建失败：'+(e.message||''), 'error'); }
}

async function approvePO(id) {
  showConfirm('确认入库', '审核通过后将自动更新库存，确认？', async () => {
    const r = await api(`/api/v1/purchase-orders/${id}/approve`, { method:'PUT' });
    const d = await r.json();
    if (r.ok) { showToast('采购单已入库'); loadOrders(currentPage); }
    else { showToast(d.detail||'操作失败', 'error'); }
  });
}
async function cancelPO(id) {
  showConfirm('取消采购单', '确认取消该采购单？', async () => {
    const r = await api(`/api/v1/purchase-orders/${id}/cancel`, { method:'PUT' });
    const d = await r.json();
    if (r.ok) { showToast('采购单已取消'); loadOrders(currentPage); }
    else { showToast(d.detail||'操作失败', 'error'); }
  });
}

// ── 导入 ──
async function openImportModal() {
  document.getElementById('impSupplier').value = '';
  document.getElementById('impDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('impNotes').value = ''; document.getElementById('impFile').value = '';
  document.getElementById('importPreview').innerHTML = ''; importLines = [];
  await initSelects(); openModal('import-modal');
}
function downloadTemplate() {
  const csv = '物品名称,分类,规格,品牌,数量,单价,批次号\nA4打印纸,办公用品,A4 70g,得力,5,25,\n墨盒,办公用品,HP 80A,惠普,2,200,HP-2026\n胶带,办公用品,48mm,得力,10,5,\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download='采购导入模板.csv'; a.click();
}
function previewImport() {
  const f = document.getElementById('impFile').files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = function(e) {
    const ls = e.target.result.split('\n').filter(l=>l.trim()); if (ls.length<2){showToast('CSV为空','error');return;}
    importLines = [];
    for (let i=1;i<ls.length;i++){const p=ls[i].split(',');const n=(p[0]||'').trim();if(!n)continue;
      importLines.push({item_name:n,category:(p[1]||'').trim(),specification:(p[2]||'').trim(),brand:(p[3]||'').trim(),quantity:parseInt(p[4])||1,unit_price:parseFloat(p[5])||0,batch_no:(p[6]||'').trim()});}
    document.getElementById('importPreview').innerHTML = `<table class="table"><thead><tr><th>物品</th><th>分类</th><th>规格</th><th>品牌</th><th>数量</th><th>单价</th><th>批次</th></tr></thead>
      <tbody>${importLines.map(l=>`<tr><td>${esc(l.item_name)}</td><td>${esc(l.category||'-')}</td><td>${esc(l.specification||'-')}</td><td>${esc(l.brand||'-')}</td><td>${l.quantity}</td><td>${l.unit_price.toFixed(2)}</td><td>${esc(l.batch_no||'-')}</td></tr>`).join('')}</tbody></table>
      <p style="color:var(--text-secondary);margin-top:8px;">${importLines.length} 种物品</p>`;
  }; r.readAsText(f);
}
async function submitImport() {
  const sn = document.getElementById('impSupplier').value.trim();
  const wid = parseInt(document.getElementById('impWarehouse').value);
  const pd = document.getElementById('impDate').value;
  if (!sn||!wid||!pd) { showToast('请填写供应商、仓库和日期','error'); return; }
  if (importLines.length===0) { showToast('请先上传CSV','error'); return; }
  const sid = await ensureSupplier(sn); if (!sid) { showToast('无法创建供应商','error'); return; }
  const items = [];
  for (const l of importLines) { try { const it = await ensureItem(l.item_name,l.category,l.specification,l.brand); items.push({item_id:it.id,quantity:l.quantity,unit_price:l.unit_price,batch_no:l.batch_no}); } catch(e) { showToast(e.message,'error'); return; } }
  try {
    const r = await api('/api/v1/purchase-orders/',{method:'POST',body:JSON.stringify({supplier_id:sid,warehouse_id:wid,purchase_date:pd,notes:document.getElementById('impNotes').value,items})});
    const d = await r.json();
    if (r.ok) { showToast(`采购单 ${d.document_no} 导入成功`); closeModal('import-modal'); loadOrders(); }
    else { showToast(d.detail||'导入失败','error'); }
  } catch(e) { showToast('导入失败：'+(e.message||''),'error'); }
}
document.addEventListener('DOMContentLoaded', () => { loadOrders(); initSelects(); });
</script>
