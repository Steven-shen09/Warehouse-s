{% extends "base.html" %}
{% block title %}固定资产管理 - Warehouse-s{% endblock %}
{% block content %}
<h2>固定资产管理</h2>

<div class="card" style="margin-bottom: 20px;">
  <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <input type="text" id="searchInput" class="form-input" placeholder="搜索名称/资产编号/序列号..." style="max-width: 240px;" oninput="loadAssets()">
    <select id="statusFilter" class="form-input" style="max-width: 120px;" onchange="loadAssets()">
      <option value="">全部状态</option>
      <option value="在库">在库</option>
      <option value="使用中">使用中</option>
      <option value="维修中">维修中</option>
      <option value="已报废">已报废</option>
    </select>
    {% if current_user.role in ('admin', 'approver') %}
    <button class="btn btn-primary" onclick="batchGenerateCodes()"><i class="bi bi-upc-scan"></i> 批量生成编号</button>
    {% endif %}
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-wrapper">
      <table class="table">
        <thead><tr><th>资产编号</th><th>物品名称</th><th>规格</th><th>品牌</th><th>状态</th><th>使用人</th><th>部门</th><th>领取日期</th><th>操作</th></tr></thead>
        <tbody id="assetTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;"></div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-header"><span id="confirm-title">确认操作</span><button class="btn btn-outline btn-sm" onclick="closeModal('confirm-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body"><p id="confirm-message" style="color:var(--text-secondary);"></p><div id="confirm-extra"></div></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-success" id="confirm-btn">确认</button>
    </div>
  </div>
</div>

<!-- 编辑/详情模态框 -->
<div class="modal-overlay" id="asset-modal">
  <div class="modal" style="max-width: 650px;">
    <div class="modal-header"><span>资产详情</span><button class="btn btn-outline btn-sm" onclick="closeModal('asset-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" id="assetDetailBody"></div>
    <div class="modal-footer" id="assetDetailFooter">
      <button class="btn btn-outline" onclick="closeModal('asset-modal')">关闭</button>
    </div>
  </div>
</div>
<!-- 领用/转移模态框 -->
<div class="modal-overlay" id="assign-modal">
  <div class="modal">
    <div class="modal-header"><span id="assignModalTitle">领用/转移资产</span><button class="btn btn-outline btn-sm" onclick="closeModal('assign-modal')"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">使用人（系统用户）</label><select id="assignUser" class="form-input"><option value="">-- 选择系统用户 --</option></select></div>
      <div class="form-group"><label class="form-label">或手动输入姓名</label><input type="text" id="assignUserName" class="form-input" placeholder="手动输入使用人姓名"></div>
      <div class="form-group" id="assignDateGroup"><label class="form-label">日期</label><input type="date" id="assignDate" class="form-input"></div>
      <div class="form-group" id="assignReturnGroup"><label class="form-label">预计归还日期</label><input type="date" id="assignReturnDate" class="form-input"></div>
      <div class="form-group"><label class="form-label">备注</label><input type="text" id="assignNotes" class="form-input"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('assign-modal')">取消</button>
      <button class="btn btn-primary" id="assignBtn" onclick="doAssign()">确认</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let _confirmCb = null;

document.getElementById('confirm-btn').addEventListener('click', () => {
  if (_confirmCb) { closeModal('confirm-modal'); _confirmCb(); _confirmCb = null; }
});

function showConfirm(title, msg, cb, extra) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = msg;
  document.getElementById('confirm-extra').innerHTML = extra || '';
  _confirmCb = cb;
  openModal('confirm-modal');
}

async function loadAssets(page = 1) {
  currentPage = page;
  const kw = document.getElementById('searchInput').value;
  const st = document.getElementById('statusFilter').value;
  let url = `/api/v1/assets?keyword=${encodeURIComponent(kw)}&status=${encodeURIComponent(st)}&page=${page}`;
  const r = await api(url);
  const data = await r.json();
  document.getElementById('assetTableBody').innerHTML = data.assets.map(a => `
    <tr>
      <td><span class="status-badge">${esc(a.asset_code || '-')}</span></td>
      <td>${esc(a.item_name)}</td><td>${esc(a.specification || '-')}</td><td>${esc(a.brand || '-')}</td>
      <td><span class="status-badge ${a.status === '在库' ? 'available' : a.status === '使用中' ? 'lent' : a.status === '维修中' ? 'damaged' : 'rejected'}">${a.status}</span></td>
      <td>${esc(a.user_name || '-')}</td><td>${esc(a.department_name || '-')}</td><td>${esc(a.assignment_date || '-')}</td>
      <td style="white-space: nowrap;">
        <button class="btn btn-outline btn-sm" onclick='showAssetDetail(${a.id})'><i class="bi bi-eye"></i></button>
        {% if current_user.role in ('admin', 'approver') %}
        ${a.status === '在库' ? `<button class="btn btn-primary btn-sm" onclick="openAssign(${a.id})">领用</button>` : ''}
        ${a.status === '使用中' ? `<button class="btn btn-success btn-sm" onclick="returnAsset(${a.id})">交回</button><button class="btn btn-outline btn-sm" onclick="openTransfer(${a.id})">转移</button>` : ''}
        ${a.status === '在库' || a.status === '使用中' ? `<button class="btn btn-outline btn-sm" onclick="repairAsset(${a.id})">送修</button>` : ''}
        ${a.status === '维修中' ? `<button class="btn btn-success btn-sm" onclick="repairDone(${a.id})">修复完成</button>` : ''}
        ${a.status !== '已报废' ? `<button class="btn btn-danger btn-sm" onclick="openDisposal(${a.id})">报废</button>` : ''}
        {% endif %}
      </td>
    </tr>`).join('');
  renderPagination(data.total, page, 'loadAssets');
}

async function showAssetDetail(aid) {
  const r = await api(`/api/v1/assets/${aid}`);
  const a = await r.json();
  document.getElementById('assetDetailBody').innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">资产编号</label><div class="form-input" style="background:var(--bg);">${esc(a.asset_code || '-')}</div></div>
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">序列号</label><div class="form-input" style="background:var(--bg);">${esc(a.serial_number || '-')}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">物品名称</label><div class="form-input" style="background:var(--bg);">${esc(a.item_name)}</div></div>
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">分类</label><div class="form-input" style="background:var(--bg);">${esc(a.category || '-')}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">规格</label><div class="form-input" style="background:var(--bg);">${esc(a.specification || '-')}</div></div>
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">品牌</label><div class="form-input" style="background:var(--bg);">${esc(a.brand || '-')}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:120px;"><label class="form-label">状态</label><div class="form-input" style="background:var(--bg);"><span class="status-badge ${a.status === '在库' ? 'available' : a.status === '使用中' ? 'lent' : a.status === '维修中' ? 'damaged' : 'rejected'}">${a.status}</span></div></div>
      <div class="form-group" style="flex:1;min-width:120px;"><label class="form-label">领取日期</label><div class="form-input" style="background:var(--bg);">${esc(a.assignment_date || '-')}</div></div>
      <div class="form-group" style="flex:1;min-width:120px;"><label class="form-label">价值</label><div class="form-input" style="background:var(--bg);">¥${(a.value||0).toFixed(2)}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">使用人</label><div class="form-input" style="background:var(--bg);">${esc(a.user_name || '-')}</div></div>
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">部门</label><div class="form-input" style="background:var(--bg);">${esc(a.department_name || '-')}</div></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">采购日期</label><div class="form-input" style="background:var(--bg);">${a.purchase_date || '-'}</div></div>
      <div class="form-group" style="flex:1;min-width:180px;"><label class="form-label">备注</label><div class="form-input" style="background:var(--bg);">${esc(a.notes || '-')}</div></div>
    </div>
    <div style="margin-top:20px;">
      <div class="card-title" style="margin-bottom:12px;">领用历史</div>
      ${(a.assignments||[]).length === 0 ? '<p style="color:var(--text-muted);">暂无领用记录</p>' : `
      <div class="table-wrapper">
        <table class="table">
          <thead><tr><th>使用人</th><th>部门</th><th>领用日期</th><th>归还日期</th><th>状态</th></tr></thead>
          <tbody>${a.assignments.map(h => `<tr><td>${esc(h.user_name)}</td><td>${esc(h.department_name)}</td><td>${h.assignment_date}</td><td>${h.actual_return_date || '-'}</td><td><span class="status-badge ${h.status === '使用中' ? 'lent' : 'returned'}">${h.status}</span></td></tr>`).join('')}</tbody>
        </table>
      </div>`}
    </div>
  `;
  document.getElementById('assetDetailFooter').innerHTML = `
    <div class="card-title" style="margin-bottom:12px;">编辑信息</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;width:100%;margin-bottom:8px;">
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">资产编号</label><input type="text" id="editAssetCode" class="form-input" value="${esc(a.asset_code || '')}"></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">序列号</label><input type="text" id="editSerialNo" class="form-input" value="${esc(a.serial_number || '')}"></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">使用人</label><input type="text" id="editUserName" class="form-input" value="${esc(a.user_name || '')}"></div>
      <div class="form-group" style="flex:1;min-width:140px;"><label class="form-label">部门</label><input type="text" id="editDeptName" class="form-input" value="${esc(a.department_name || '')}"></div>
    </div>
    <button class="btn btn-outline" onclick="closeModal('asset-modal')">关闭</button>
    <button class="btn btn-primary" onclick="saveAsset(${aid})">保存</button>`;
  openModal('asset-modal');
}

async function saveAsset(aid) {
  const code = document.getElementById('editAssetCode').value.trim();
  const sn = document.getElementById('editSerialNo').value.trim();
  const un = document.getElementById('editUserName').value.trim();
  const dn = document.getElementById('editDeptName').value.trim();
  let url = `/api/v1/assets/${aid}?asset_code=${encodeURIComponent(code)}&serial_number=${encodeURIComponent(sn)}`;
  if (un) url += `&user_name=${encodeURIComponent(un)}`;
  if (dn) url += `&department_name=${encodeURIComponent(dn)}`;
  try {
    const r = await api(url, { method: 'PUT' });
    const d = await r.json();
    if (r.ok) { showToast('保存成功'); closeModal('asset-modal'); loadAssets(currentPage); }
    else { showToast(d.detail || '保存失败', 'error'); }
  } catch(e) { showToast('保存失败', 'error'); }
}

async function openAssign(aid) {
  const r = await api('/api/v1/users?page_size=200');
  const data = await r.json();
  document.getElementById('assignUser').innerHTML = (data.items||[]).map(u => `<option value="${u.id}">${esc(u.display_name||u.username)}</option>`).join('');
  document.getElementById('assignDateGroup').style.display = '';
  document.getElementById('assignReturnGroup').style.display = '';
  document.getElementById('assignUserName').value = '';
  document.getElementById('assignDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('assignReturnDate').value = '';
  document.getElementById('assignNotes').value = '';
  document.getElementById('assignBtn').textContent = '确认领用';
  document.getElementById('assignBtn').onclick = doAssign;
  currentAssetId = aid;
  openModal('assign-modal');
}

function _getAssignUserParams() {
  const uid = document.getElementById('assignUser').value;
  const uname = document.getElementById('assignUserName').value.trim();
  let params = '';
  if (uid) params += `&assigned_to_user_id=${uid}`;
  if (uname) params += `&user_name=${encodeURIComponent(uname)}`;
  return params;
}

async function doAssign() {
  const userParams = _getAssignUserParams();
  const ad = document.getElementById('assignDate').value;
  const erd = document.getElementById('assignReturnDate').value;
  const notes = document.getElementById('assignNotes').value;
  if (!userParams || !ad) { showToast('请填写使用人和日期', 'error'); return; }
  let url = `/api/v1/assets/${currentAssetId}/assign?assignment_date=${ad}&notes=${encodeURIComponent(notes)}${userParams}`;
  if (erd) url += `&expected_return_date=${erd}`;
  const r = await api(url, { method: 'POST' });
  const d = await r.json();
  if (r.ok) { showToast('领用成功'); closeModal('assign-modal'); loadAssets(currentPage); }
  else { showToast(d.detail || '领用失败', 'error'); }
}

async function returnAsset(aid) {
  showConfirm('交回资产', '确认将该资产交回仓库？', async () => {
    const r = await api(`/api/v1/assets/${aid}/return`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) { showToast('资产已交回'); loadAssets(currentPage); }
    else { showToast(d.detail || '操作失败', 'error'); }
  });
}

async function openTransfer(aid) {
  currentAssetId = aid;
  const [usersR, assetR] = await Promise.all([
    api('/api/v1/users?page_size=200'),
    api(`/api/v1/assets/${aid}`)
  ]);
  const usersData = await usersR.json();
  const assetData = await assetR.json();
  document.getElementById('assignUser').innerHTML = (usersData.items||[]).map(u => `<option value="${u.id}">${esc(u.display_name||u.username)}</option>`).join('');
  if (assetData.current_user_id) {
    document.getElementById('assignUser').value = assetData.current_user_id;
  }
  document.getElementById('assignUserName').value = assetData.user_name || '';
  document.getElementById('assignNotes').value = '';
  document.getElementById('assignDateGroup').style.display = 'none';
  document.getElementById('assignReturnGroup').style.display = 'none';
  document.getElementById('assignBtn').textContent = '确认转移';
  document.getElementById('assignBtn').onclick = async () => {
    const uid = document.getElementById('assignUser').value;
    const uname = document.getElementById('assignUserName').value.trim();
    if (!uid && !uname) { showToast('请选择或输入使用人', 'error'); return; }
    let url = `/api/v1/assets/${currentAssetId}/transfer?notes=${encodeURIComponent(document.getElementById('assignNotes').value)}`;
    if (uid) url += `&new_user_id=${uid}`;
    if (uname) url += `&user_name=${encodeURIComponent(uname)}`;
    const r = await api(url, { method: 'POST' });
    const d = await r.json();
    if (r.ok) { showToast('转移成功'); closeModal('assign-modal'); loadAssets(currentPage); }
    else { showToast(d.detail || '转移失败', 'error'); }
    document.getElementById('assignBtn').textContent = '确认领用';
    document.getElementById('assignBtn').onclick = doAssign;
    document.getElementById('assignDateGroup').style.display = '';
    document.getElementById('assignReturnGroup').style.display = '';
  };
  openModal('assign-modal');
}

async function repairAsset(aid) {
  showConfirm('送修资产', '确认将该资产送修？', async () => {
    const r = await api(`/api/v1/assets/${aid}/repair`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) { showToast('资产已送修'); loadAssets(currentPage); }
    else { showToast(d.detail || '操作失败', 'error'); }
  });
}

async function repairDone(aid) {
  showConfirm('修复完成', '确认该资产已修复完成？', async () => {
    const r = await api(`/api/v1/assets/${aid}/repair-done`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) { showToast('资产已恢复'); loadAssets(currentPage); }
    else { showToast(d.detail || '操作失败', 'error'); }
  });
}

async function openDisposal(aid) {
  showConfirm('报废资产', '请填写报废信息', async () => {
    const dt = document.getElementById('disposalType').value;
    const reason = document.getElementById('disposalReason').value;
    const r = await api(`/api/v1/asset-disposals?asset_instance_id=${aid}&disposal_type=${dt}&reason=${encodeURIComponent(reason)}`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) { showToast('报废申请已提交'); loadAssets(currentPage); }
    else { showToast(d.detail || '操作失败', 'error'); }
  }, '<div class="form-group"><label>报废类型</label><select id="disposalType" class="form-input"><option value="报废">报废</option><option value="出售">出售</option><option value="捐赠">捐赠</option><option value="丢失">丢失</option></select></div><div class="form-group"><label>原因</label><textarea id="disposalReason" class="form-input" rows="2"></textarea></div>');
}

async function batchGenerateCodes() {
  showConfirm('批量生成编号', '将为所有无编号的资产自动生成编号，确认？', async () => {
    const r = await api('/api/v1/assets/batch-generate-codes', { method: 'POST' });
    const d = await r.json();
    showToast(d.message);
    loadAssets(currentPage);
  });
}

document.addEventListener('DOMContentLoaded', () => loadAssets());
</script>
{% endblock %}
