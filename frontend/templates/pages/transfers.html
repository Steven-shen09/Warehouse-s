{% extends "base.html" %}
{% block title %}调拨管理 - Warehouse-s{% endblock %}

{% block content %}
<div class="flex-between mb-16">
  <h2>调拨管理</h2>
  {% if current_user.role in ('admin', 'approver') %}
  <button class="btn btn-primary" onclick="openTransferModal()">
    <i class="bi bi-plus-lg"></i> 新建调拨
  </button>
  {% endif %}
</div>

<!-- 筛选栏 -->
<div class="filter-bar">
  <select id="status-filter" class="form-select" onchange="loadTransfers(1)">
    <option value="">全部状态</option>
    <option value="pending">待审核</option>
    <option value="approved">已通过</option>
    <option value="rejected">已驳回</option>
  </select>
</div>

<!-- 调拨列表 -->
<div id="transfers-table-container">
  <div class="text-center text-muted" style="padding:48px;">加载中...</div>
</div>

<!-- 新建调拨模态框 -->
<div class="modal-overlay" id="transfer-form-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>新建调拨</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('transfer-form-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="transfer-form" onsubmit="submitTransfer(event)">
        <div class="form-group">
          <label class="form-label">物品 *</label>
          <select id="transfer-item" class="form-select" required>
            <option value="">请选择物品</option>
          </select>
        </div>
        <div style="display:flex;gap:12px;">
          <div class="form-group" style="flex:1;">
            <label class="form-label">源仓库 *</label>
            <select id="transfer-from-warehouse" class="form-select" required>
              <option value="">请选择源仓库</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">目标仓库 *</label>
            <select id="transfer-to-warehouse" class="form-select" required>
              <option value="">请选择目标仓库</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">数量 *</label>
          <input type="number" id="transfer-quantity" class="form-input" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label class="form-label">调拨原因</label>
          <textarea id="transfer-reason" class="form-textarea" rows="3" placeholder="请简要说明调拨原因"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">确认提交</button>
      </form>
    </div>
  </div>
</div>

<!-- 驳回确认模态框 -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>驳回调拨</h3>
      <button class="btn btn-sm btn-outline" onclick="closeModal('reject-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <p id="reject-message" class="text-muted"></p>
      <div class="form-group" style="margin-top:12px;">
        <label class="form-label">驳回原因 *</label>
        <textarea id="reject-reason" class="form-textarea" placeholder="请填写驳回原因（必填）" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reject-modal')">取消</button>
      <button class="btn btn-danger" id="reject-btn">确认驳回</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let _rejectCallback = null;

// ── HTML 转义 ──
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── 状态映射 ──
const statusMap = {
  pending:  '待审核',
  approved: '已通过',
  rejected: '已驳回',
};

function statusBadge(status) {
  const label = statusMap[status] || status;
  return `<span class="status-badge ${status}">${label}</span>`;
}

// ── 驳回弹窗 ──
function showRejectDialog(transferId, itemName) {
  document.getElementById('reject-message').textContent = '确定驳回调拨 "' + itemName + '" 吗？';
  document.getElementById('reject-reason').value = '';
  _rejectCallback = transferId;
  openModal('reject-modal');
}

document.getElementById('reject-btn').addEventListener('click', async () => {
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { showToast('请填写驳回原因', 'error'); return; }
  if (_rejectCallback) {
    const id = _rejectCallback;
    closeModal('reject-modal');
    _rejectCallback = null;
    const resp = await api(`/api/v1/transfers/${id}/reject`, { method: 'PUT', body: JSON.stringify({ reason }) });
    if (resp.ok) { showToast('已驳回'); loadTransfers(currentPage); }
    else { const d = await resp.json(); showToast(d.detail || '驳回失败', 'error'); }
  }
});

// ── 通过调拨 ──
async function approveTransfer(id) {
  const resp = await api(`/api/v1/transfers/${id}/approve`, { method: 'PUT' });
  if (resp.ok) { showToast('已通过'); loadTransfers(currentPage); }
  else { const d = await resp.json(); showToast(d.detail || '操作失败', 'error'); }
}

// ── 加载辅助数据 ──
async function loadItemsForSelect() {
  const resp = await api('/api/v1/items/?page_size=999');
  if (!resp.ok) return;
  const data = await resp.json();
  const select = document.getElementById('transfer-item');
  data.items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name + (item.available_quantity !== undefined ? '（可用: ' + item.available_quantity + '）' : '');
    select.appendChild(opt);
  });
}

async function loadWarehousesForSelect() {
  const resp = await api('/api/v1/warehouses/');
  if (!resp.ok) return;
  const data = await resp.json();
  const fromSelect = document.getElementById('transfer-from-warehouse');
  const toSelect = document.getElementById('transfer-to-warehouse');
  data.warehouses.forEach(wh => {
    const optFrom = document.createElement('option');
    optFrom.value = wh.id;
    optFrom.textContent = wh.name;
    fromSelect.appendChild(optFrom);

    const optTo = document.createElement('option');
    optTo.value = wh.id;
    optTo.textContent = wh.name;
    toSelect.appendChild(optTo);
  });
}

function openTransferModal() {
  document.getElementById('transfer-form').reset();
  document.getElementById('transfer-from-warehouse').value = '';
  document.getElementById('transfer-to-warehouse').value = '';
  document.getElementById('transfer-item').value = '';
  document.getElementById('transfer-quantity').value = '1';
  document.getElementById('transfer-reason').value = '';
  openModal('transfer-form-modal');
}

// ── 提交调拨 ──
async function submitTransfer(e) {
  e.preventDefault();
  const fromWh = parseInt(document.getElementById('transfer-from-warehouse').value);
  const toWh = parseInt(document.getElementById('transfer-to-warehouse').value);
  if (fromWh === toWh) {
    showToast('源仓库与目标仓库不能相同', 'error');
    return;
  }
  const body = {
    item_id: parseInt(document.getElementById('transfer-item').value),
    from_warehouse_id: fromWh,
    to_warehouse_id: toWh,
    quantity: parseInt(document.getElementById('transfer-quantity').value),
    reason: document.getElementById('transfer-reason').value.trim(),
  };
  const resp = await api('/api/v1/transfers/', { method: 'POST', body: JSON.stringify(body) });
  if (resp.ok) {
    closeModal('transfer-form-modal');
    showToast('调拨申请已提交');
    loadTransfers(1);
  } else {
    const d = await resp.json();
    showToast(d.detail || '提交失败', 'error');
  }
}

// ── 分页 ──
function renderPagination(total, pageSize, current) {
  const pages = Math.ceil(total / pageSize);
  if (pages <= 1) return '';
  let html = '<div class="pagination">';
  html += `<button onclick="loadTransfers(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
  for (let i = 1; i <= pages; i++) {
    html += `<button class="${i === current ? 'active' : ''}" onclick="loadTransfers(${i})">${i}</button>`;
  }
  html += `<button onclick="loadTransfers(${current + 1})" ${current === pages ? 'disabled' : ''}>下一页</button>`;
  html += '</div>';
  return html;
}

// ── 加载调拨列表 ──
async function loadTransfers(page = 1) {
  currentPage = page;
  const status = document.getElementById('status-filter').value;
  const params = new URLSearchParams({ page, page_size: 20 });
  if (status) params.set('status', status);

  const resp = await api(`/api/v1/transfers/?${params}`);
  const container = document.getElementById('transfers-table-container');

  if (!resp.ok) {
    container.innerHTML = '<div class="empty-state">加载失败</div>';
    return;
  }

  const data = await resp.json();
  if (!data.transfers || data.transfers.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon"><i class="bi bi-arrow-left-right"></i></div><p>暂无调拨记录</p></div>';
    return;
  }

  const isAdmin = AppState.isAdmin;
  container.innerHTML = `
    <table class="table">
      <thead><tr>
        <th>单号</th>
        <th>物品名称</th>
        <th>源仓库 → 目标仓库</th>
        <th>数量</th>
        <th>状态</th>
        <th>原因</th>
        <th>创建人</th>
        <th>时间</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${data.transfers.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${escapeHtml(t.item_name || t.item?.name || '-')}</td>
          <td>
            <span>${escapeHtml(t.from_warehouse_name || t.from_warehouse?.name || '-')}</span>
            <i class="bi bi-arrow-right" style="margin:0 6px;color:var(--text-secondary);"></i>
            <span>${escapeHtml(t.to_warehouse_name || t.to_warehouse?.name || '-')}</span>
          </td>
          <td>${t.quantity}</td>
          <td>${statusBadge(t.status)}</td>
          <td class="text-muted">${escapeHtml(t.reason || '-')}</td>
          <td>${escapeHtml(t.created_by_name || t.created_by?.display_name || t.created_by?.username || '-')}</td>
          <td>${t.created_at || '-'}</td>
          <td>
            ${isAdmin && t.status === 'pending' ? `
            <div class="btn-group">
              <button class="btn btn-success btn-sm" onclick="approveTransfer(${t.id})">通过</button>
              <button class="btn btn-danger btn-sm" onclick="showRejectDialog(${t.id}, '${escapeHtml(t.item_name || t.item?.name || '#' + t.id)}')">驳回</button>
            </div>
            ` : '<span class="text-muted" style="font-size:13px;">--</span>'}
          </td>
        </tr>`).join('')}</tbody>
    </table>
    ${renderPagination(data.total, 20, currentPage)}
  `;
}

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
  loadItemsForSelect();
  loadWarehousesForSelect();
  loadTransfers();
});
</script>
{% endblock %}
