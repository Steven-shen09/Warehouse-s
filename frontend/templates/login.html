{% extends "base.html" %}
{% block title %}登录 - Warehouse-s{% endblock %}

{% block fullpage %}
<div class="login-page">
  <div class="login-card">
    <h1><i class="bi bi-box-seam"></i> Warehouse-s</h1>
    <p style="text-align:center;color:#999;margin-bottom:20px;font-size:14px;">物品租借管理系统</p>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
      </div>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="btn btn-primary">登 录</button>
    </form>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eee;">
      <p style="font-size:12px;color:#999;text-align:center;">预置账号</p>
      <p style="font-size:12px;color:#999;text-align:center;">管理员: admin / admin123</p>
      <p style="font-size:12px;color:#999;text-align:center;">审核员: approver1 / 123456</p>
      <p style="font-size:12px;color:#999;text-align:center;">用户: user1 / 123456</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');

  try {
    const resp = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok) {
      AppState.setAuth(data.access_token, data.user);
      window.location.href = '/dashboard';
    } else {
      errorEl.textContent = data.detail || '登录失败';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = '网络错误，请重试';
    errorEl.style.display = 'block';
  }
}
</script>
{% endblock %}
